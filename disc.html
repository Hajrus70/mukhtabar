<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مقياس أنماط DISC</title>
<meta name="description" content="اكتشف أسلوبك السلوكي في العمل والتواصل">
<meta property="og:title" content="مقياس أنماط DISC">
<meta property="og:description" content="اكتشف أسلوبك السلوكي في العمل والتواصل">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2040%2040%22%3E%3Crect%20x%3D%221%22%20y%3D%221%22%20width%3D%2238%22%20height%3D%2238%22%20rx%3D%2210%22%20fill%3D%22%230E6B60%22%2F%3E%3Cpath%20d%3D%22M8%2027c4-9%208-9%2012%200s8%209%2012%200%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.6%22%20stroke-linecap%3D%22round%22%2F%3E%3Ccircle%20cx%3D%2220%22%20cy%3D%2213%22%20r%3D%223.2%22%20fill%3D%22%23fff%22%2F%3E%3C%2Fsvg%3E">
<script src="config.js"></script>
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F6F8F8; --ink:#14232A; --muted:#5A6B71; --line:#D5DEDC;
  --accent:#0E6B60; --accent-ink:#FFFFFF; --accent-soft:#DDEFEB; --amber:#A8691A; --amber-soft:#F6E9D5;
  --b1:#B04A35; --b2:#C2842A; --b3:#7E8F93; --b4:#3A9483; --b5:#1D7A6D; --b6:#0B5A50;
  --focus:#C2842A; --shadow:0 1px 2px rgba(20,35,42,.06),0 6px 24px -12px rgba(20,35,42,.18);
  --display:"Reem Kufi","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Geeza Pro",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1517; --surface:#142024; --surface-2:#18262B; --ink:#E2EAE8; --muted:#94A6A9; --line:#26383D;
    --accent:#3CB6A2; --accent-ink:#06201C; --accent-soft:#163632; --amber:#E2A54B; --amber-soft:#3A2B14;
    --b1:#E07A62; --b2:#E2A54B; --b3:#9AABAE; --b4:#5CC0AD; --b5:#3CB6A2; --b6:#8BE0CF;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1517; --surface:#142024; --surface-2:#18262B; --ink:#E2EAE8; --muted:#94A6A9; --line:#26383D;
  --accent:#3CB6A2; --accent-ink:#06201C; --accent-soft:#163632; --amber:#E2A54B; --amber-soft:#3A2B14;
  --b1:#E07A62; --b2:#E2A54B; --b3:#9AABAE; --b4:#5CC0AD; --b5:#3CB6A2; --b6:#8BE0CF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;margin:0}
#app{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;text-align:right}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;line-height:1.35;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:13px;letter-spacing:.02em;color:var(--muted);font-weight:500}

/* الترويسة */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 18px;border-bottom:1px solid var(--line);margin-bottom:28px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:40px;height:40px;flex:none}
.brand h1{font-size:24px}
.brand p{margin:0;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink)}
.linkbtn:hover{border-color:var(--accent);color:var(--accent)}

/* الصفحة الرئيسية */
.intro{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start;margin-bottom:36px}
.intro h2{font-size:34px;margin-bottom:10px}
.intro p{margin:0 0 10px;max-width:60ch}
.scale{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.scale h3{font-size:16px;margin-bottom:10px}
.scale ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.scale li{display:grid;grid-template-columns:14px 78px 1fr;gap:10px;align-items:center}
.sw{width:14px;height:14px;border-radius:4px}
.section-h{display:flex;align-items:baseline;gap:12px;margin:8px 0 14px;flex-wrap:wrap}
.section-h h2{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:36px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:right;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .code{font-family:var(--display);font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 8px;align-self:flex-start}
.card h3{font-size:19px}
.card p{margin:0;font-size:14px;color:var(--muted);line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted)}
.card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
.status{font-weight:600}
.status.done{color:var(--accent)}
.status.prog{color:var(--amber)}
.go{color:var(--accent);font-weight:600}
.note{font-size:13.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-width:none}

/* الاختبار */
.testbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.testbar h2{font-size:22px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:var(--shadow)}
.qnum{font-family:var(--display);color:var(--accent);font-size:15px;margin-bottom:6px}
.qtext{font-size:20px;font-weight:600;line-height:1.7;margin:0 0 20px;max-width:62ch}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:right;background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16.5px;line-height:1.6;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt .let{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-size:15px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .let{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.likert{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.likert .opt{flex-direction:column;justify-content:center;text-align:center;gap:6px;padding:12px 6px;font-size:14px;min-height:84px}
.likert .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.likert .opt.sel .dot{background:var(--accent);border-color:var(--accent)}
.bipolar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.pole{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:17px;font-weight:600}
.pole b{display:block;font-family:var(--display);color:var(--accent);font-size:14px;font-weight:600;margin-bottom:4px}
.fig{display:flex;justify-content:center;margin:4px 0 20px;color:var(--ink)}
.fig svg{max-width:100%;height:auto}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{position:relative;background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.tile svg{width:100%;max-width:110px;height:auto}
.tile .let{font-family:var(--display);font-size:14px;color:var(--muted)}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.sel .let{color:var(--accent)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 18px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:var(--accent-ink)}
.btn.warn{border-color:var(--b1);color:var(--b1)}
.map{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.map button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.map button.ans{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.map button.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin-top:10px}

/* النتائج */
.res-hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:var(--shadow)}
.score{text-align:center;min-width:150px}
.score .big{font-family:var(--display);font-size:72px;line-height:1;font-weight:700;color:var(--bandc,var(--accent))}
.score .lbl{font-size:13px;color:var(--muted);margin-top:6px}
.band{display:inline-block;font-weight:700;border-radius:999px;padding:3px 14px;font-size:15px;color:var(--bandc);border:1.5px solid var(--bandc);margin-bottom:8px}
.res-hero p{margin:4px 0}
.curve{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px 8px;margin-bottom:18px;overflow-x:auto}
.curve svg{display:block;width:100%;min-width:520px;height:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:18px}
.panel h3{font-size:19px;margin-bottom:12px}
.panel p{margin:0 0 10px;max-width:70ch}
.bars{display:grid;gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(120px,210px) 1fr 64px;gap:12px;align-items:center;font-size:15px}
.bar{height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar-row .v{text-align:left;font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
ul.clean{margin:0;padding-inline-start:20px}
ul.clean li{margin-bottom:6px}
.trait{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.trait:first-of-type{border-top:0;padding-top:0;margin-top:0}
.trait h4{font-family:var(--display);font-size:17px;font-weight:600;margin:0 0 4px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lvl{font-family:var(--body);font-size:13px;font-weight:600;border-radius:999px;padding:0 10px;background:var(--accent-soft);color:var(--accent)}
.lvl.lo{background:var(--amber-soft);color:var(--amber)}
.lvl.mid{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.dual{display:grid;grid-template-columns:90px 1fr 90px;gap:10px;align-items:center;font-size:14px;margin-bottom:12px}
.dual .track{position:relative;height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px}
.dual .track::after{content:"";position:absolute;top:-4px;bottom:-4px;left:50%;width:1px;background:var(--muted)}
.dual .fill{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.dual .l{text-align:right}
.dual .r{text-align:left}
.dual .on{font-weight:700;color:var(--accent)}
.typecode{font-family:var(--display);font-size:64px;letter-spacing:.06em;line-height:1;color:var(--accent);direction:ltr}
.review{display:grid;gap:12px}
.rv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.rv .h{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.rv .q{font-weight:600;margin:4px 0}
.ok{color:var(--b5);font-weight:700}
.no{color:var(--b1);font-weight:700}
.rv .e{font-size:14px;color:var(--muted);margin:4px 0 0}
.rv .figs{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0}
.rv .figs svg{max-width:150px;height:auto;color:var(--ink)}
.lock{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lock input{font:inherit;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:8px 12px;width:200px;max-width:100%}
.err{color:var(--b1);font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.prof-table{width:100%;border-collapse:collapse;font-size:15px}
.prof-table th,.prof-table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}
.prof-table th{font-size:13px;color:var(--muted);font-weight:500}
.tablewrap{overflow-x:auto}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0 6px}
.fld{display:grid;gap:6px;font-size:14px;font-weight:600}
.fld.full{grid-column:1/-1}
.fld input,.fld select{font:inherit;font-weight:400;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:9px 12px;width:100%}
.fld input:focus,.fld select:focus{border-color:var(--accent);outline:none}
.req{color:var(--b1)}
@media (max-width:520px){.fgrid{grid-template-columns:1fr}}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

@media (max-width:760px){
  .intro{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}
  .res-hero{grid-template-columns:1fr;text-align:center}
  .cols{grid-template-columns:1fr}
  .bipolar{grid-template-columns:1fr}
}
@media (max-width:520px){
  .grid{grid-template-columns:1fr}
  .intro h2{font-size:27px}
  .qcard{padding:20px 16px}
  .qtext{font-size:18px}
  .likert{grid-template-columns:1fr}
  .likert .opt{flex-direction:row;min-height:0;justify-content:flex-start;text-align:right;padding:10px 14px}
  .tiles,.tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar-row{grid-template-columns:1fr 56px}
  .bar-row .bar{grid-column:1/-1;grid-row:2}
  .dual{grid-template-columns:70px 1fr 70px;font-size:13px}
  .score .big{font-size:60px}
  .nav [data-finish]{order:3;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="stripes" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="currentColor" stroke-width="2.2"/>
    </pattern>
  </defs>
</svg>

<div id="app" dir="rtl" lang="ar"></div>

function shapeSVG(sh,cx,cy,r,f){
  const fill = f==="solid"?"currentColor":f==="striped"?"url(#stripes)":"none";
  const st=`fill="${fill}" stroke="currentColor" stroke-width="2"`;
  const poly=(n,rot)=>Array.from({length:n},(_,i)=>{const a=rot+i*2*Math.PI/n;return (cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1);}).join(" ");
  switch(sh){
    case "circle": return `<circle cx="${cx}" cy="${cy}" r="${r*0.92}" ${st}/>`;
    case "square": {const s=r*1.6;return `<rect x="${cx-s/2}" y="${cy-s/2}" width="${s}" height="${s}" ${st}/>`;}
    case "triangle": return `<polygon points="${poly(3,-Math.PI/2)}" transform="translate(0 ${r*0.15})" ${st}/>`;
    case "diamond": return `<polygon points="${poly(4,-Math.PI/2)}" ${st}/>`;
    case "hexagon": return `<polygon points="${poly(6,0)}" ${st}/>`;
  }
}
const POS={1:[[0,0]],2:[[-.24,-.22],[.24,.22]],3:[[0,-.26],[-.26,.2],[.26,.2]]};
const BASE={1:.34,2:.19,3:.165}, SZ={s:.6,m:.8,l:1};
function cellSVG(s,x,y,C){
  if(!s) return `<text x="${x+C/2}" y="${y+C/2+14}" text-anchor="middle" font-size="40" font-family="Reem Kufi,sans-serif" fill="currentColor" opacity=".55">؟</text>`;
  const r=C*BASE[s.n]*SZ[s.z];
  return POS[s.n].map(([dx,dy])=>shapeSVG(s.sh,x+C/2+dx*C,y+C/2+dy*C,r,s.f)).join("");
}
function matrixSVG(cells){
  const C=84,G=6,W=3*C+4*G;
  let o=`<svg viewBox="0 0 ${W} ${W}" width="${W}" role="img" aria-label="مصفوفة أشكال ٣×٣ بخانة فارغة">`;
  for(let i=0;i<9;i++){const r=Math.floor(i/3),c=i%3;const x=W-G-(c+1)*C-c*G,y=G+r*(C+G);
    o+=`<rect x="${x}" y="${y}" width="${C}" height="${C}" rx="8" fill="var(--surface)" stroke="var(--line)" ${i===8?'stroke-dasharray="5 4" stroke-width="2"':''}/>`+cellSVG(cells[i]||null,x,y,C);}
  return o+"</svg>";
}
function oneCellSVG(s){const C=84;return `<svg viewBox="0 0 ${C} ${C}" role="img" aria-label="خيار">`+cellSVG(s,0,0,C)+"</svg>";}
function polySVG(cells,big){
  const U=big?26:20,P=6,n=4,W=n*U+2*P;
  const h=Math.max(...cells.map(p=>p[0]))+1,w=Math.max(...cells.map(p=>p[1]))+1;
  const ox=P+(n-w)*U/2, oy=P+(n-h)*U/2;
  let o=`<svg viewBox="0 0 ${W} ${W}" ${big?`width="${W*1.6}"`:""} role="img" aria-label="شكل مكوّن من مربعات">`;
  for(const [r,c] of cells) o+=`<rect x="${(ox+c*U).toFixed(1)}" y="${(oy+r*U).toFixed(1)}" width="${U}" height="${U}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" rx="2"/>`;
  return o+"</svg>";
}

/* ============ التصحيح ============ */
function scoreIQ(id){
  const t=T(id), K=getKey()[id], items=itemsOf(id), A=answers(id);
  let raw=0; const cat={};
  items.forEach((it,i)=>{
    const c=cat[it.c] ||= {got:0,max:0};
    const pts = t.w ? (A[i]===null?0:K[i].w[A[i]]) : (A[i]===K[i].a?1:0);
    raw+=pts; c.got+=pts; c.max+= t.w?3:1;
  });
  const iq=Math.max(55,Math.min(145,Math.round(100+15*(raw-t.norm.m)/t.norm.sd)));
  return {raw,iq,cat,pct:pctile(iq)};
}
function scoreBig5(){
  const A=answers("bigfive"), s={O:0,C:0,E:0,A:0,N:0};
  DATA.bigfive.items.forEach((it,i)=>{const v=(A[i]??2)+1; let x=it.k===1?v:6-v; if(it.t==="N") x=6-x; s[it.t]+=x;});
  const out={}; for(const k in s){const p=Math.round((s[k]-6)/24*100); out[k]={raw:s[k],p,lv:p>65?"hi":p<35?"lo":"mid"};} return out;
}
function scoreTypes(){
  const A=answers("types"), tot={EI:0,SN:0,TF:0,JP:0}, n={EI:0,SN:0,TF:0,JP:0};
  DATA.types.items.forEach((it,i)=>{const v=2-(A[i]??2); const first=it.d[0]; tot[it.d]+= it.p===first? v : -v; n[it.d]++;});
  let code=""; const dims={};
  for(const d of ["EI","SN","TF","JP"]){const L=tot[d]>0?d[0]:d[1]; code+=L; dims[d]={L,firstPct:Math.round(50+tot[d]/(2*n[d])*50)};}
  return {code,dims};
}
function scoreDISC(){
  const A=answers("disc"), c={D:0,I:0,S:0,C:0};
  DATA.disc.items.forEach((it,i)=>{if(A[i]!==null)c[it.s[A[i]]]++;});
  const order=Object.keys(c).sort((a,b)=>c[b]-c[a]||"DISC".indexOf(a)-"DISC".indexOf(b));
  return {c,order};
}

/* ============ النتائج ============ */
function bellSVG(iq,color){
  const W=640,H=190,x0=30,x1=W-30,base=150,top=22;
  const X=v=>x0+(v-55)/(145-55)*(x1-x0);
  const pdf=v=>Math.exp(-((v-100)**2)/(2*225));
  const pts=[];for(let v=55;v<=145;v+=1)pts.push([X(v),base-(base-top)*pdf(v)]);
  const seg=(a,b,c)=>{const p=pts.filter(q=>q[0]>=X(a)-.01&&q[0]<=X(b)+.01);return `<path d="M${X(a)},${base} L${p.map(q=>q.join(",")).join(" L")} L${X(b)},${base} Z" fill="var(${c})" opacity=".22"/>`;};
  const regions=[[55,80,"--b1"],[80,90,"--b2"],[90,110,"--b3"],[110,120,"--b4"],[120,130,"--b5"],[130,145,"--b6"]];
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="موقع الدرجة ${iq} على منحنى التوزيع الطبيعي">`;
  o+=regions.map(r=>seg(...r)).join("");
  o+=`<path d="M${pts.map(q=>q.join(",")).join(" L")}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`;
  o+=`<line x1="${x0}" y1="${base}" x2="${x1}" y2="${base}" stroke="var(--line)" stroke-width="1.5"/>`;
  for(const v of [70,80,90,100,110,120,130,140]) o+=`<line x1="${X(v)}" y1="${base}" x2="${X(v)}" y2="${base+5}" stroke="var(--muted)"/><text x="${X(v)}" y="${base+22}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="IBM Plex Sans Arabic,sans-serif">${ar(v)}</text>`;
  const labels=[[67,"ضعيف"],[85,"أقل"],[100,"متوسط"],[115,"جيد"],[125,"مرتفع"],[137.5,"عبقري"]];
  for(const [v,l] of labels) o+=`<text x="${X(v)}" y="${base-6}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans Arabic,sans-serif">${l}</text>`;
  const xm=X(iq), ym=base-(base-top)*pdf(iq);
  o+=`<line x1="${xm}" y1="${top-8}" x2="${xm}" y2="${base}" stroke="var(${color})" stroke-width="2.5"/><circle cx="${xm}" cy="${ym}" r="6" fill="var(${color})" stroke="var(--surface)" stroke-width="2"/>`;
  o+=`<text x="${Math.min(Math.max(xm,50),W-50)}" y="${top-12}" text-anchor="middle" font-size="14" font-weight="700" fill="var(${color})" font-family="Reem Kufi,sans-serif">${ar(iq)}</text>`;
  return o+"</svg>";
}

  <div class="testbar"><div><span class="eyebrow">قبل البدء</span><h2>بيانات المشارك</h2></div></div>
  <form class="qcard who" id="whof" novalidate>
    <p class="muted" style="margin-top:0">تُرسل بياناتك ونتائجك إلى المدرب لأغراض التدريب والتطوير، ولا تُنشر لأي جهة أخرى. تُطلب هذه البيانات مرة واحدة على هذا الجهاز.</p>
    <div class="fgrid">
      <label class="fld full"><span>الاسم الكامل <b class="req">*</b></span><input id="f-name" value="${esc(p.name||"")}" autocomplete="name" required></label>
      <label class="fld"><span>رقم الهاتف أو البريد الإلكتروني</span><input id="f-contact" value="${esc(p.contact||"")}" dir="auto" autocomplete="email"></label>
      <label class="fld"><span>جهة العمل أو الدورة</span><input id="f-org" value="${esc(p.org||GROUP||"")}"></label>
      <label class="fld"><span>الفئة العمرية</span>${sel("f-age",AGES,p.age)}</label>
      <label class="fld"><span>الجنس</span>${sel("f-gender",["ذكر","أنثى"],p.gender)}</label>
    </div>
    ${p.name?`<p class="muted" style="font-size:13.5px">إذا كنت مشاركًا آخر يستخدم هذا الجهاز، اكتب اسمك؛ ستبدأ اختباراتك من جديد دون أن تختلط بنتائج غيرك.</p>`:""}
    <p class="err" id="f-err" hidden>اكتب اسمك الكامل للمتابعة.</p>
    <div class="nav"><button class="btn" type="button" data-go="home">→ رجوع</button><button class="btn primary" type="submit">حفظ والمتابعة ←</button></div>
  </form>`;
}
function summaryOf(id){
  const t=T(id);
  if(t.kind==="iq"){const r=scoreIQ(id),b=bandOf(r.iq);
    const cats={};for(const k in r.cat)cats[k]={n:t.cats[k].n,p:Math.round(r.cat[k].got/r.cat[k].max*100)};
    const K=getKey()[id], A=answers(id);
    const pts=A.map((u,i)=>t.w?(u===null?0:K[i].w[u]):(u===K[i].a?1:0));
    return {score:r.iq,band:b.label,percentile:Math.round(r.pct),summary:`${r.iq} · ${b.label}`,details:{raw:r.raw,max:t.max,cats,pts}};}
  if(id==="bigfive"){const s=scoreBig5(),TR=DATA.bigfive.traits;
    return {score:"",band:"",percentile:"",summary:["O","C","E","A","N"].map(k=>`${TR[k].short} ${s[k].p}%`).join(" · "),details:{traits:s}};}
  if(id==="types"){const r=scoreTypes();return {score:"",band:r.code,percentile:"",summary:`${r.code} · ${DATA.types.types[r.code].n}`,details:r};}
  const r=scoreDISC();const bl=DATA.disc.blends[r.order[0]+r.order[1]];
  return {score:"",band:r.order[0]+"/"+r.order[1],percentile:"",summary:`${r.order[0]}/${r.order[1]} · ${bl}`,details:{...r,blend:bl}};
}
function payload(id,status){
  const t=T(id), A=answers(id), now=new Date();
  const p={attempt_id:store.att[id],participant_id:person.pid,name:person.name,contact:person.contact||"",org:person.org||"",group:GROUP||person.group||"",age:person.age||"",gender:person.gender||"",
    test_id:id,test_name:t.name,kind:t.kind==="iq"?"ذكاء":"شخصية",status,answered:A.filter(v=>v!==null).length,
    started_at:store.t0[id],updated_at:now.toISOString(),completed_at:"",duration_min:Math.round((now-new Date(store.t0[id]))/6000)/10,
    score:"",band:"",percentile:"",summary:"",details_json:"",answers_json:JSON.stringify(A),device:/Mobi|Android|iPhone/i.test(navigator.userAgent)?"جوال":"حاسوب"};
  if(status==="completed"){const s=summaryOf(id);Object.assign(p,{completed_at:store.t1[id]||now.toISOString(),score:s.score,band:s.band,percentile:s.percentile,summary:s.summary,details_json:JSON.stringify(s.details)});
    p.duration_min=Math.round((new Date(p.completed_at)-new Date(store.t0[id]))/6000)/10;}
  return p;
}
let queue=[]; try{queue=JSON.parse(localStorage.getItem("mkh-queue")||"[]");}catch(e){}
const saveQ=()=>{try{localStorage.setItem("mkh-queue",JSON.stringify(queue));}catch(e){}};
function send(p,beacon){
  if(!ENDPOINT||!person) return;
  const body=JSON.stringify(p);
  if(beacon&&navigator.sendBeacon){try{navigator.sendBeacon(ENDPOINT,new Blob([body],{type:"text/plain"}));return;}catch(e){}}
  if(p.status==="completed"){queue=queue.filter(q=>q.attempt_id!==p.attempt_id);queue.push(p);saveQ();}
  fetch(ENDPOINT,{method:"POST",body,headers:{"Content-Type":"text/plain;charset=utf-8"},redirect:"follow"})
    .then(r=>{if(p.status==="completed"){queue=queue.filter(q=>q.attempt_id!==p.attempt_id);saveQ();}})
    .catch(()=>{});
}
function track(id,status,beacon){ if(!store.att[id]||!person) return; send(payload(id,status),beacon); }
function ensureAttempt(id){ if(!store.att[id]){store.att[id]=uid();store.t0[id]=new Date().toISOString();save();track(id,"started");} }
function flushQueue(){ if(!ENDPOINT) return; queue.slice().forEach(p=>fetch(ENDPOINT,{method:"POST",body:JSON.stringify(p),headers:{"Content-Type":"text/plain;charset=utf-8"}}).then(()=>{queue=queue.filter(q=>q.attempt_id!==p.attempt_id);saveQ();}).catch(()=>{})); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&view.name==="test"&&!store.done[view.id]) track(view.id,"in_progress",true); });
function openTest(id){
  if(store.done[id]) return go("result",id);
  if(!person||!person.name){pendingOpen=id;return go("who");}
  ensureAttempt(id); go("test",id);
}

/* ============ التفاعل ============ */
let advTimer=null;
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.go){resetArm=null;return go(b.dataset.go);}
  if(b.dataset.open){const id=b.dataset.open;review.open=false;review.err=false;resetArm=null;return openTest(id);}
  if(b.dataset.who){pendingOpen=null;return go("who");}
  if(b.dataset.ans!==undefined){
    const id=view.id, A=answers(id), i=store.idx[id]||0; const was=A[i]; A[i]=+b.dataset.ans; save();
    if(was===null){const n=A.filter(v=>v!==null).length; if(n%5===0&&n<30) track(id,"in_progress");}
    clearTimeout(advTimer); render();
    if(i<29) advTimer=setTimeout(()=>{store.idx[id]=Math.min(29,i+1);save();render();},260);
    return;
  }
  if(b.dataset.step){clearTimeout(advTimer);const id=view.id;store.idx[id]=Math.max(0,Math.min(29,(store.idx[id]||0)+ +b.dataset.step));save();return render();}
  if(b.dataset.jump){clearTimeout(advTimer);store.idx[view.id]=+b.dataset.jump;save();return render();}
  if(b.dataset.finish){store.done[view.id]=true;store.t1[view.id]=new Date().toISOString();save();track(view.id,"completed");review.open=false;return go("result",view.id);}
  if(b.dataset.reset){const id=b.dataset.reset;
    if(resetArm!==id){resetArm=id;return render();}
    resetArm=null;delete store.done[id];delete store.att[id];delete store.t1[id];store.ans[id]=new Array(30).fill(null);store.idx[id]=0;save();return openTest(id);}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="whof"){e.preventDefault();
    const name=$("#f-name").value.trim().replace(/\s+/g," ");
    if(name.length<3){$("#f-err").hidden=false;$("#f-name").focus();return;}
    const same=person&&normAr(person.name||"")===normAr(name);
    if(person&&person.name&&!same){store={ans:{},idx:{},done:{},att:{},t0:{},t1:{}};save();}
    person={pid:same?person.pid:uid(),name,contact:$("#f-contact").value.trim(),org:$("#f-org").value.trim(),age:$("#f-age").value,gender:$("#f-gender").value,group:GROUP||(person&&person.group)||""};
    savePerson();
    const id=pendingOpen; pendingOpen=null; return id?openTest(id):go("home");}
  if(e.target.id!=="lockf")return; e.preventDefault();
  if(fnv(normAr($("#code").value||""))===CODEHASH){review.open=true;review.err=false;}else{review.err=true;}
  render();
});
document.addEventListener("keydown",e=>{
  if(view.name!=="test"||e.target.tagName==="INPUT")return;
  const n="123456".indexOf(e.key); const ai="١٢٣٤٥٦".indexOf(e.key); const k=n>=0?n:ai;
  if(k>=0){const btn=document.querySelector(`[data-ans="${k}"]`); if(btn) btn.click();}
});
flushQueue();
render();
</script>
