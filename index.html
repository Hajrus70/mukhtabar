<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F6F8F8; --ink:#14232A; --muted:#5A6B71; --line:#D5DEDC;
  --accent:#0E6B60; --accent-ink:#FFFFFF; --accent-soft:#DDEFEB; --amber:#A8691A; --amber-soft:#F6E9D5;
  --b1:#B04A35; --b2:#C2842A; --b3:#7E8F93; --b4:#3A9483; --b5:#1D7A6D; --b6:#0B5A50;
  --focus:#C2842A; --shadow:0 1px 2px rgba(20,35,42,.06),0 6px 24px -12px rgba(20,35,42,.18);
  --display:"Reem Kufi","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Geeza Pro",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1517; --surface:#142024; --surface-2:#18262B; --ink:#E2EAE8; --muted:#94A6A9; --line:#26383D;
    --accent:#3CB6A2; --accent-ink:#06201C; --accent-soft:#163632; --amber:#E2A54B; --amber-soft:#3A2B14;
    --b1:#E07A62; --b2:#E2A54B; --b3:#9AABAE; --b4:#5CC0AD; --b5:#3CB6A2; --b6:#8BE0CF;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1517; --surface:#142024; --surface-2:#18262B; --ink:#E2EAE8; --muted:#94A6A9; --line:#26383D;
  --accent:#3CB6A2; --accent-ink:#06201C; --accent-soft:#163632; --amber:#E2A54B; --amber-soft:#3A2B14;
  --b1:#E07A62; --b2:#E2A54B; --b3:#9AABAE; --b4:#5CC0AD; --b5:#3CB6A2; --b6:#8BE0CF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.75;margin:0}
#app{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;text-align:right}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;line-height:1.35;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:13px;letter-spacing:.02em;color:var(--muted);font-weight:500}

/* الترويسة */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 18px;border-bottom:1px solid var(--line);margin-bottom:28px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:40px;height:40px;flex:none}
.brand h1{font-size:24px}
.brand p{margin:0;font-size:13px;color:var(--muted)}
.linkbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink)}
.linkbtn:hover{border-color:var(--accent);color:var(--accent)}

/* الصفحة الرئيسية */
.intro{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start;margin-bottom:36px}
.intro h2{font-size:34px;margin-bottom:10px}
.intro p{margin:0 0 10px;max-width:60ch}
.scale{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.scale h3{font-size:16px;margin-bottom:10px}
.scale ul{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:14px}
.scale li{display:grid;grid-template-columns:14px 78px 1fr;gap:10px;align-items:center}
.sw{width:14px;height:14px;border-radius:4px}
.section-h{display:flex;align-items:baseline;gap:12px;margin:8px 0 14px;flex-wrap:wrap}
.section-h h2{font-size:22px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:36px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;text-align:right;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .code{font-family:var(--display);font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 8px;align-self:flex-start}
.card h3{font-size:19px}
.card p{margin:0;font-size:14px;color:var(--muted);line-height:1.65}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--muted)}
.card .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
.status{font-weight:600}
.status.done{color:var(--accent)}
.status.prog{color:var(--amber)}
.go{color:var(--accent);font-weight:600}
.note{font-size:13.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;max-width:none}

/* الاختبار */
.testbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.testbar h2{font-size:22px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:22px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px 24px;box-shadow:var(--shadow)}
.qnum{font-family:var(--display);color:var(--accent);font-size:15px;margin-bottom:6px}
.qtext{font-size:20px;font-weight:600;line-height:1.7;margin:0 0 20px;max-width:62ch}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:right;background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16.5px;line-height:1.6;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt .let{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-size:15px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .let{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.likert{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.likert .opt{flex-direction:column;justify-content:center;text-align:center;gap:6px;padding:12px 6px;font-size:14px;min-height:84px}
.likert .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--muted)}
.likert .opt.sel .dot{background:var(--accent);border-color:var(--accent)}
.bipolar{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.pole{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:17px;font-weight:600}
.pole b{display:block;font-family:var(--display);color:var(--accent);font-size:14px;font-weight:600;margin-bottom:4px}
.fig{display:flex;justify-content:center;margin:4px 0 20px;color:var(--ink)}
.fig svg{max-width:100%;height:auto}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.tile{position:relative;background:var(--surface-2);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
.tile:hover{border-color:var(--accent)}
.tile svg{width:100%;max-width:110px;height:auto}
.tile .let{font-family:var(--display);font-size:14px;color:var(--muted)}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.sel .let{color:var(--accent)}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 18px;font-weight:600}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:var(--accent-ink)}
.btn.warn{border-color:var(--b1);color:var(--b1)}
.map{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}
.map button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.map button.ans{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.map button.cur{outline:2px solid var(--accent);outline-offset:1px;color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin-top:10px}

/* النتائج */
.res-hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:var(--shadow)}
.score{text-align:center;min-width:150px}
.score .big{font-family:var(--display);font-size:72px;line-height:1;font-weight:700;color:var(--bandc,var(--accent))}
.score .lbl{font-size:13px;color:var(--muted);margin-top:6px}
.band{display:inline-block;font-weight:700;border-radius:999px;padding:3px 14px;font-size:15px;color:var(--bandc);border:1.5px solid var(--bandc);margin-bottom:8px}
.res-hero p{margin:4px 0}
.curve{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 16px 8px;margin-bottom:18px;overflow-x:auto}
.curve svg{display:block;width:100%;min-width:520px;height:auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin-bottom:18px}
.panel h3{font-size:19px;margin-bottom:12px}
.panel p{margin:0 0 10px;max-width:70ch}
.bars{display:grid;gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(120px,210px) 1fr 64px;gap:12px;align-items:center;font-size:15px}
.bar{height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar-row .v{text-align:left;font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}
ul.clean{margin:0;padding-inline-start:20px}
ul.clean li{margin-bottom:6px}
.trait{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.trait:first-of-type{border-top:0;padding-top:0;margin-top:0}
.trait h4{font-family:var(--display);font-size:17px;font-weight:600;margin:0 0 4px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lvl{font-family:var(--body);font-size:13px;font-weight:600;border-radius:999px;padding:0 10px;background:var(--accent-soft);color:var(--accent)}
.lvl.lo{background:var(--amber-soft);color:var(--amber)}
.lvl.mid{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.dual{display:grid;grid-template-columns:90px 1fr 90px;gap:10px;align-items:center;font-size:14px;margin-bottom:12px}
.dual .track{position:relative;height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px}
.dual .track::after{content:"";position:absolute;top:-4px;bottom:-4px;left:50%;width:1px;background:var(--muted)}
.dual .fill{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.dual .l{text-align:right}
.dual .r{text-align:left}
.dual .on{font-weight:700;color:var(--accent)}
.typecode{font-family:var(--display);font-size:64px;letter-spacing:.06em;line-height:1;color:var(--accent);direction:ltr}
.review{display:grid;gap:12px}
.rv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.rv .h{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.rv .q{font-weight:600;margin:4px 0}
.ok{color:var(--b5);font-weight:700}
.no{color:var(--b1);font-weight:700}
.rv .e{font-size:14px;color:var(--muted);margin:4px 0 0}
.rv .figs{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0}
.rv .figs svg{max-width:150px;height:auto;color:var(--ink)}
.lock{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lock input{font:inherit;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:8px 12px;width:200px;max-width:100%}
.err{color:var(--b1);font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.prof-table{width:100%;border-collapse:collapse;font-size:15px}
.prof-table th,.prof-table td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:right}
.prof-table th{font-size:13px;color:var(--muted);font-weight:500}
.tablewrap{overflow-x:auto}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

@media (max-width:760px){
  .intro{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}
  .res-hero{grid-template-columns:1fr;text-align:center}
  .cols{grid-template-columns:1fr}
  .bipolar{grid-template-columns:1fr}
}
@media (max-width:520px){
  .grid{grid-template-columns:1fr}
  .intro h2{font-size:27px}
  .qcard{padding:20px 16px}
  .qtext{font-size:18px}
  .likert{grid-template-columns:1fr}
  .likert .opt{flex-direction:row;min-height:0;justify-content:flex-start;text-align:right;padding:10px 14px}
  .tiles,.tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar-row{grid-template-columns:1fr 56px}
  .bar-row .bar{grid-column:1/-1;grid-row:2}
  .dual{grid-template-columns:70px 1fr 70px;font-size:13px}
  .score .big{font-size:60px}
  .nav [data-finish]{order:3;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

    <pattern id="stripes" patternUnits="userSpaceOnUse" width="5" height="5" patternTransform="rotate(45)">
      <rect width="5" height="5" fill="none"/>
      <line x1="0" y1="0" x2="0" y2="5" stroke="currentColor" stroke-width="2.2"/>
    </pattern>
  </defs>
</svg>

فعّالًا؟","o":["أعيد لها الكلمة: «أظن أن زميلتنا لم تكمل فكرتها»","أخبرها بعد الاجتماع أنني لاحظت ذلك","أتجاهل الأمر لأنه ليس من شأني","أنصحها بأن تكون أكثر حزمًا"],"c":"emp"},{"q":"تتعلم مهارة جديدة، وتقدّمك بطيء. ما الأنسب؟","o":["أستنتج أنني لا أملك الموهبة وأتوقف","أقارن نفسي بالمتميزين لأحفّز نفسي","أقيس تقدمي بمقارنة نفسي بالأمس، وأحدد أهدافًا صغيرة قابلة للقياس","أبحث عن مدرب أو مصدر تعلم أفضل"],"c":"mot"},{"q":"في نقاش عائلي حاد، بدأ صوتك يرتفع. ما أفضل تصرف؟","o":["أرفع صوتي أكثر ليُسمع رأيي","أصمت حتى ينتهي النقاش","أطلب استراحة قصيرة، وأعود للنقاش حين أهدأ","أخفض صوتي وأواصل"],"c":"reg"},{"q":"وصلتك رسالة مستفزة من عميل وأنت غاضب. ما الأنسب؟","o":["أكتب مسودة ولا أرسلها حتى أهدأ، ثم أراجعها مركزًا على حل المشكلة","أرد فورًا لأوضح له خطأه","أطلب من زميل أن يرد بدلًا مني","أؤجل الرد عدة أيام"],"c":"reg"},{"q":"لاحظت أنك ترد بحدّة على زملائك في الأيام التي تنام فيها قليلًا. ما التصرف الأنسب؟","o":["أعترف لنفسي بهذا النمط، وأنتبه لحالتي في تلك الأيام، وأؤجل النقاشات الحساسة","هذا طبعي، وعلى الآخرين أن يتقبلوه","أحاول أن أنام أكثر دون أن أغيّر شيئًا في تعاملي","أعتذر لمن رددت عليه بحدة بعد وقوع الموقف"],"c":"aware"},{"q":"فقد إنسان شيئًا ثمينًا، ويشعر أنه كان بإمكانه منع ذلك. ما الشعور الأرجح؟","o":["الدهشة","الخوف","الندم","الحزن"],"c":"und"},{"q":"أخبرك صديق بأنه فقد وظيفته. ما أول استجابة أنسب؟","o":["أحكي له عن مرة فقدت فيها وظيفتي وكانت أصعب","أعرض عليه المساعدة في البحث عن عمل","أخبره أن الأمر ليس بهذا السوء وأن الوظائف كثيرة","أنصت إليه، وأعبّر عن تفهمي لصعوبة الموقف قبل تقديم أي نصيحة"],"c":"emp"},{"q":"تأخرت رحلتك ساعات، وستفوتك مناسبة مهمة. ما الأجدى؟","o":["أتقبل انزعاجي، ثم أركز على ما يمكنني فعله: إبلاغ أصحاب المناسبة والبحث عن بدائل","أتشاجر مع موظف المكتب","أنتظر وأنا أتذمر من شركة الطيران","أتصل بأصحاب المناسبة للاعتذار"],"c":"reg"},{"q":"تلقيت ملاحظة من مديرك بأن عروضك التقديمية طويلة. ما الاستجابة الأكثر نضجًا؟","o":["أوضح له أن الموضوع يتطلب التفصيل","أشكره وأختصر العرض القادم","أستنتج أنه لا يقدّر جهدي","أطلب أمثلة محددة، وأراجع عروضي السابقة لأتحقق من الملاحظة"],"c":"aware"},{"q":"ما الشعور الذي يجمع بين الحزن والشوق إلى ما مضى؟","o":["الحنين","الندم","الغيرة","القلق"],"c":"und"},{"q":"قيل لك إنك تبدو غاضبًا في الاجتماعات، بينما تشعر أنك هادئ. ما الأنسب؟","o":["الآخرون يسيئون فهمي، ولا شيء علي فعله","أحرص على الابتسام أكثر","أعدّ ذلك مؤشرًا على فجوة بين ما أشعر به وما تعكسه تعابيري، وأنتبه لها","أسأل زميلًا موثوقًا عن التعابير التي لاحظها"],"c":"aware"},{"q":"أي العبارات التالية تعبّر عن وعي ذاتي أعلى؟","o":["«أنا متوتر بسبب ضغط العمل»","«أنا متوتر لأنني أخشى ألا يكون عملي بالمستوى المطلوب»","«أشعر بالتوتر»","«هذا العمل سيئ»"],"c":"aware"},{"q":"موظف كان يخشى تقييمًا قادمًا، ثم علم أن التقييم تأجل. ما الشعور الأرجح؟","o":["الارتياح","الفرح","الملل","الإحباط"],"c":"und"},{"q":"عاد طفلك من المدرسة منفعلًا يشكو من معلمه. ما الاستجابة الأكثر تعاطفًا وحكمة؟","o":["أخبره بأن المعلم دائمًا على حق","أستمع إليه وأعترف بمشاعره، ثم أسمع رواية المعلم قبل الحكم","أهدّئه وأعده بأنني سأتحدث مع المعلم","أذهب للمدرسة غاضبًا للدفاع عنه"],"c":"emp"},{"q":"أمامك مهمة مملة لكنها ضرورية، وتشعر برغبة في تأجيلها. ما الأنفع؟","o":["أنتظر حتى أشعر بالرغبة في العمل","أؤجلها إلى آخر لحظة","أقسّمها إلى أجزاء صغيرة، وأبدأ بأولها الآن، مع مكافأة بسيطة بعد الإنجاز","أحدد لها موعدًا ثابتًا في جدولي"],"c":"reg"},{"q":"لم تحصل على ترقية تراها مستحقة. ما الاستجابة الأنفع على المدى البعيد؟","o":["أواصل عملي بالمستوى نفسه وأنتظر الفرصة القادمة","أطلب تغذية راجعة واضحة عن المعايير، وأضع خطة لسد الفجوات","أقلل جهدي لأن الجهد لا يُقدَّر","أبحث فورًا عن عمل آخر"],"c":"mot"},{"q":"طُلب منك تحسين إجراء عمل ليس من مسؤولياتك المباشرة. ماذا يفعل غالبًا صاحب الدافعية الذاتية العالية؟","o":["يقبل بشرط الحصول على مقابل","يرحب بالفرصة للتعلم وإضافة القيمة، مع تنسيق أولوياته","يرفض لأنها ليست من مسؤولياته","يقبل ويؤدي الحد المطلوب"],"c":"mot"},{"q":"تعرف أنك تميل إلى قبول مهام تفوق وقتك لأنك تكره الرفض. ما الأنفع؟","o":["أقبل المهام ثم أعمل ساعات إضافية لإنجازها","أحدد مسبقًا حدود طاقتي، وأطلب مهلة للتفكير قبل قبول أي مهمة جديدة","أناقش أولوياتي الحالية مع مديري عند كل طلب جديد","أقبل ثم أنجز المهام بجودة أقل دون إخبار أحد"],"c":"aware"},{"q":"رسبت في اختبار مهني مهم. أي تفسير هو الأكثر فائدة؟","o":["«طريقة استعدادي لم تكن كافية هذه المرة، ويمكنني تعديلها»","«لست ذكيًا بما يكفي لهذا المجال»","«لم يحالفني الحظ»","«كان الاختبار صعبًا، وسأحاول مرة أخرى»"],"c":"mot"},{"q":"أي المشاعر يكون عادة مزيجًا من الخوف والدهشة؟","o":["الفضول","الملل","الرهبة","الإعجاب"],"c":"und"},{"q":"موظف جديد في فريقك يبدو متوترًا في أيامه الأولى. ما الأفضل؟","o":["التوتر طبيعي ولا يستدعي شيئًا","أعرّفه بالفريق، وأعرض أن أكون مرجعًا له في أسئلته اليومية","أنتظر أن يطلب المساعدة بنفسه","أرسل له دليل العمل ليقرأه"],"c":"emp"},{"q":"خرجت من اجتماع وأنت تشعر بضيق لا تعرف سببه. ما أفضل خطوة؟","o":["أفترض أن أحد الحاضرين قصد إزعاجي","أتحدث مع زميل موثوق عن الاجتماع","أنشغل بعمل آخر حتى يزول الضيق","أتوقف لحظة لأسمّي الشعور بدقة، وأتتبع ما أثاره في الاجتماع"],"c":"aware"},{"q":"إذا تبيّن للغاضب أن الإساءة كانت غير مقصودة، فإلى أي شعور يتحول غضبه غالبًا؟","o":["يتراجع الغضب، وقد يصحبه حرج من التسرع","الخوف","الحزن","يستمر الغضب كما هو"],"c":"und"},{"q":"حققت هدفًا كبيرًا. أي تصرف يعكس دافعية ناضجة؟","o":["أنتقل مباشرة إلى هدف آخر دون توقف","أنتظر أن يحدد لي أحد هدفًا جديدًا","أرتاح فترة ثم أفكر في الخطوة القادمة","أحتفي بالإنجاز، وأراجع ما تعلمته، ثم أضع هدفًا جديدًا أعلى"],"c":"mot"},{"q":"تعمل على مشروع طويل لا تظهر نتائجه قبل سنة. كيف تحافظ على حماسك؟","o":["أذكّر نفسي بالمكافأة النهائية","أعتمد على مديري ليحفزني","أربط المشروع بقيمة تهمني، وأقسمه إلى مراحل أحتفي بإنجاز كل منها","أعمل عليه فقط حين يقترب موعد التسليم"],"c":"mot"},{"q":"زميلك الذي كان مرحًا دائمًا أصبح صامتًا منذ أسبوع. ما التصرف الأنسب؟","o":["أسأل الزملاء الآخرين عمّا به","أمازحه أمام الجميع ليعود إلى مرحه","أسأله على انفراد وبلطف إن كان كل شيء على ما يرام، وأحترم رغبته إن لم يُرد الحديث","أترك له مساحة وأبقى متاحًا"],"c":"emp"},{"q":"رُفض مشروعك بعد جهد طويل، وتشعر بالإحباط. ما الاستجابة الأكثر اتزانًا؟","o":["أسمح لنفسي بالشعور بالإحباط، ثم أطلب أسباب الرفض لأستفيد منها","أقرر ألا أبذل جهدًا إضافيًا مستقبلًا","أكتم الإحباط وأتظاهر بأن الأمر لا يهمني","أنتقل فورًا إلى مشروع آخر"],"c":"reg"},{"q":"علّق زميل بسخرية على فكرتك أمام الفريق. ما التصرف الأنسب؟","o":["أتجاهل التعليق وأكمل","أحافظ على هدوئي، وأعيد طرح الفكرة بموضوعية، ثم أحدّثه على انفراد لاحقًا","أنسحب من النقاش","أرد عليه بسخرية مماثلة"],"c":"reg"},{"q":"عميل مسنّ يكرر سؤاله للمرة الثالثة وهو مرتبك. ما الأنسب؟","o":["أكتب له المعلومة على ورقة وأنهي اللقاء","أكرر الشرح بالطريقة نفسها بهدوء","أشرح بطريقة مختلفة وأبسط، بصبر، وأتأكد من فهمه","أطلب منه أن يأتي مع أحد أبنائه"],"c":"emp"},{"q":"شخص تعرّض لظلم متكرر ولم يستطع الرد. أي الانفعالات أرجح أن يتراكم لديه؟","o":["الخجل","الحزن","الاستياء والغضب المكبوت","الملل"],"c":"und"}],"social":[{"q":"لاحظت في مجلس أن أحد الحضور صامت ويبدو مستبعدًا من الحديث. ما التصرف الأذكى؟","o":["أجلس بجانبه لاحقًا وأتحدث معه","أوجّه إليه سؤالًا عن موضوع يعرفه","أعلّق مازحًا على صمته","أتركه، فربما يحب الصمت"],"c":"cue"},{"q":"أثناء حديثك، ينظر محدّثك إلى ساعته مرارًا ويوجّه جسده نحو الباب. ماذا يعني ذلك غالبًا؟","o":["غاضب منك","يشعر بالملل من الموضوع","يفكر بعمق فيما تقول","يرغب في إنهاء الحديث أو أنه مستعجل"],"c":"cue"},{"q":"في مجلس لكبار السن، طُرح رأي تعتقد أنه خاطئ. ما الأنسب؟","o":["أسكت احترامًا","أعرض رأيي بأدب وتقدير، بصيغة السؤال أو الإضافة لا التخطئة","أنتظر وأوضح رأيي لأحدهم على انفراد","أصحح الرأي مباشرة وبحزم"],"c":"norm"},{"q":"انضممت إلى مؤسسة جديدة ثقافتها رسمية جدًا. ما الأنسب في الأسابيع الأولى؟","o":["أتصرف بطبيعتي، والناس سيتأقلمون معي","أراقب الأعراف السائدة وأتكيف معها قبل أن أقترح أي تغيير","أكون رسميًا جدًا وأتجنب أي حديث ودّي","أسأل زميلًا عن الأعراف غير المكتوبة"],"c":"norm"},{"q":"في تفاوض، يصر الطرف الآخر على شرط لا يمكنك قبوله. ما الأنسب؟","o":["أرفض وأنهي التفاوض","أقبل الشرط حفاظًا على العلاقة","أقدّم تنازلًا في جانب آخر مقابل التخلي عن الشرط","أستكشف المصلحة الكامنة خلف الشرط، وأبحث عن بديل يحققها"],"c":"conf"},{"q":"انضم إلى فريقك عضو من قسم آخر ويشعر بالغربة. ما الأنفع لتماسك الفريق؟","o":["أكلفه بمهمة تُبرز خبرته وتربطه بأعضاء الفريق","أرحب به في اجتماع الفريق","أتركه يتأقلم بمرور الوقت","أطلب من الفريق مراعاته"],"c":"grp"},{"q":"أخطأ زميلك في نطق اسم عميل أمامه. ما الأنسب؟","o":["أنبهه بعد اللقاء على انفراد","أصحح له فورًا أمام العميل","لا أنبهه أبدًا","أنطق الاسم صحيحًا في حديثي أمام العميل بشكل طبيعي دون إشارة للخطأ"],"c":"norm"},{"q":"صديق يقول «أنا بخير»، لكن صوته منخفض ويتجنب النظر إليك. ما الأنسب؟","o":["أصدّق كلامه وأنتقل لموضوع آخر","أحترم إجابته وأبقى قريبًا، وأفتح له باب الحديث لاحقًا بلطف","أضغط عليه حتى يعترف بما به","أخبره أن لغة جسده تكشف أنه ليس بخير"],"c":"cue"},{"q":"انتقدك زميل بأسلوب غير لائق، لكن مضمون نقده صحيح. ما الأنضج؟","o":["أقبل النقد وأتجاهل الأسلوب","أرفض النقد لأن أسلوبه غير لائق","أشكوه إلى المدير","أفصل الأسلوب عن المضمون: أستفيد من الملاحظة، وأبلغه بهدوء لاحقًا أن أسلوبه أزعجني"],"c":"conf"},{"q":"في فريق جديد، يسيطر شخص واحد على الحديث في كل اجتماع. بصفتك منسق الاجتماع:","o":["أترك الأمر لأن لديه أفكارًا جيدة","أقاطعه أمام الجميع","أطلب منه بلطف على انفراد أن يترك مجالًا للآخرين","أستخدم تدوير الكلمة وأطلب رأي كل عضو بالترتيب"],"c":"grp"},{"q":"أرسل لك مديرك رسالة في وقت متأخر ليلًا عن أمر غير عاجل. ما الأنسب؟","o":["أرد صباحًا في وقت العمل، إلا إذا فهمت من السياق أنه عاجل","أرد وألفت نظره إلى أن الوقت متأخر","أرد فورًا دائمًا","أتجاهل الرسالة"],"c":"norm"},{"q":"قال زميل: «فكرة ممتازة» بنبرة باردة ووجه خالٍ من التعبير. الأرجح أنه:","o":["معجب فعلًا بالفكرة","لديه تحفظ لم يصرّح به","متعب فحسب","يمزح"],"c":"cue"},{"q":"أثناء عرضك التقديمي، لاحظت أن الحضور بدأوا يفقدون الانتباه. ما الأذكى؟","o":["أتحول إلى سؤال تفاعلي أو مثال واقعي قريب منهم","أسرع لأنهي العرض","أكمل كما خططت","أرفع صوتي"],"c":"cue"},{"q":"في اجتماع، عقد المدير ذراعيه وقطّب حاجبيه عندما عرضتَ الأرقام. ما التصرف الأذكى؟","o":["أسرّع العرض لأتجاوز هذا الجزء","أعيد شرح الأرقام نفسها بتفصيل أكثر","أكمل كما خططت","أتوقف وأسأله إن كانت لديه ملاحظة على الأرقام"],"c":"cue"},{"q":"أي سلوك يبني الثقة أسرع مع فريق جديد تقوده؟","o":["الإكثار من المزاح والود","الوفاء بالوعود الصغيرة باستمرار، والاعتراف بالأخطاء","الحزم والصرامة من اليوم الأول","استعراض الخبرات والإنجازات السابقة"],"c":"infl"},{"q":"اختلف زميلان في فريقك وتأثر العمل. بصفتك قائد الفريق، ما الأنسب؟","o":["أتحدث مع كل منهما منفردًا وأطلب التعاون","أنتظر حتى يحلا الأمر بنفسيهما","أجمعهما، وأستمع لكل طرف، ونركز على المصلحة المشتركة والحلول","أحدد المخطئ وأنحاز للطرف المحق علنًا"],"c":"conf"},{"q":"طُلب رأيك أمام الفريق في خطة قدمها صديق مقرب، وفيها ثغرة كبيرة. ما الأذكى اجتماعيًا ومهنيًا؟","o":["أذكر نقاط قوتها، ثم أطرح الثغرة كسؤال بنّاء لتحسينها","أنتقدها بصراحة تامة أمام الجميع","أؤجل رأيي وأخبره على انفراد بعد الاجتماع","أجاملها حفاظًا على الصداقة"],"c":"grp"},{"q":"عند تقديم العزاء، أي السلوكيات أنسب؟","o":["تقديم نصائح عن تجاوز الحزن","الحضور، والكلام القليل الصادق، والدعاء","الحديث في شؤون العمل لتخفيف الجو","الحديث المطوّل عن تفاصيل الوفاة"],"c":"norm"},{"q":"تريد إقناع إدارتك بتبني نظام جديد. أي نهج أنجع؟","o":["أشرح المزايا التقنية بالتفصيل","أربط النظام بأولويات الإدارة، وأقدّم بيانات وتجربة صغيرة ناجحة","أذكر أن المنافسين يستخدمونه","أكرر الطلب حتى يوافقوا"],"c":"infl"},{"q":"عميل غاضب يرفع صوته في الفرع. ما الأنجع؟","o":["أحيله إلى مسؤول آخر فورًا","أطلب منه خفض صوته أولًا","أشرح له فورًا أن الخطأ ليس خطأنا","أنصت دون مقاطعة، وأعترف بانزعاجه، ثم أنتقل إلى الحل بصوت هادئ"],"c":"conf"},{"q":"تريد أن يلتزم زملاؤك بإجراء جديد يرونه مرهقًا. ما الأنجع؟","o":["أشركهم في تصميم طريقة التطبيق، وأوضح سبب الإجراء","أفرض عقوبات على المخالفين","أرسل تعميمًا رسميًا ملزمًا","أقدّم مكافأة للملتزمين"],"c":"infl"},{"q":"في الاجتماعات، يرفض زميل كل اقتراح دون أن يقدم بديلًا. ما الأذكى؟","o":["أطلب من المدير حسم الأمر","أواجهه أمام الجميع بأنه سلبي","أتجاهل اعتراضاته","أسأله: «ما الذي يجعل الاقتراح مقبولًا لك؟» لتحويل الاعتراض إلى معيار"],"c":"conf"},{"q":"في مجموعة عمل، يتأخر أحد الأعضاء دائمًا ويؤثر على الجميع. ما الأنسب؟","o":["أشكوه إلى المسؤول مباشرة","أنجز مهامه بنفسي","أتحدث معه على انفراد لأفهم السبب، ونتفق على مواعيد واضحة","أناقش المشكلة أمام المجموعة"],"c":"grp"},{"q":"تحتاج دعم زميل مشغول لا تربطك به علاقة قوية. ما الأنسب؟","o":["أذكّره يوميًا حتى يستجيب","أرسل له طلبًا مفصلًا طويلًا بالبريد","أوضح له باختصار ما أحتاجه ولماذا يهمه أيضًا، وأحترم وقته","أطلب من مديره أن يكلفه"],"c":"infl"},{"q":"أي علامة تدل على أن الفريق يتمتع بالأمان النفسي؟","o":["لا توجد خلافات","يُنجز العمل في موعده","يعترف الأعضاء بأخطائهم ويطرحون الأسئلة دون خوف","يلتزم الجميع بتعليمات المدير"],"c":"grp"},{"q":"كيف تبدأ حديثًا مع شخص تقابله لأول مرة في مناسبة مهنية؟","o":["بالحديث عن إنجازاتي","بسؤال مفتوح عن عمله أو اهتمامه، مع الإصغاء لما يقول","بتعليق عام عن المناسبة","أنتظر أن يبدأ هو"],"c":"infl"},{"q":"فريق يوافق دائمًا على رأي المدير دون نقاش. ما الخطر الأكبر؟","o":["إرهاق المدير","كثرة الخلافات","بطء اتخاذ القرارات","قرارات ضعيفة لغياب الآراء المخالفة (التفكير الجمعي)"],"c":"grp"},{"q":"دعاك مديرك الأعلى إلى غداء عمل مع عميل كبير. ما الأنسب؟","o":["أتحدث عن أموري الشخصية لكسر الجمود","أتحدث كثيرًا لأُبرز نفسي","أبقى صامتًا طوال الوقت","أترك المدير يقود الحديث، وأشارك بإيجاز عند الحاجة أو عندما يُطلب مني"],"c":"norm"},{"q":"عندما تقدم ملاحظة تصحيحية لموظف، أي صيغة أكثر فاعلية؟","o":["«أداؤك جيد، لكن...»","أرسلها مكتوبة حتى لا يُحرج","أصف السلوك المحدد وأثره، ثم نتفق على ما يمكن تحسينه","«أنت دائمًا متأخر في التسليم»"],"c":"infl"},{"q":"صديقان مقربان لك متخاصمان، وكل منهما يريدك في صفه. ما الأنسب؟","o":["أنقل لكل منهما ما يقوله الآخر ليفهما بعضهما","أبتعد عن الاثنين حتى ينتهي الخلاف","أحافظ على حيادي، وأرفض نقل الكلام، وأشجعهما على الحديث مباشرة","أنحاز لمن أراه محقًا"],"c":"conf"}],"bigfive":{"items":[{"t":"E","k":1,"q":"أشعر بالحيوية عندما أكون بين الناس."},{"t":"A","k":1,"q":"أهتم بمشاعر الآخرين وأحوالهم."},{"t":"C","k":1,"q":"أنجز مهامي قبل موعدها المحدد."},{"t":"N","k":1,"q":"أقلق كثيرًا بشأن أمور قد لا تحدث."},{"t":"O","k":1,"q":"أستمتع بالتفكير في الأفكار المجردة والنظريات."},{"t":"E","k":-1,"q":"أفضّل قضاء وقتي بمفردي على حضور التجمعات الكبيرة."},{"t":"A","k":-1,"q":"أنتقد الآخرين بسهولة."},{"t":"C","k":-1,"q":"أترك أغراضي في غير أماكنها."},{"t":"N","k":-1,"q":"أبقى هادئًا في المواقف الصعبة."},{"t":"O","k":-1,"q":"أفضّل الروتين المألوف على التجارب الجديدة."},{"t":"E","k":1,"q":"أبادر بالتعارف في المناسبات."},{"t":"A","k":1,"q":"أثق بنوايا الناس عمومًا."},{"t":"C","k":1,"q":"أهتم بالتفاصيل وأراجع عملي بدقة."},{"t":"N","k":1,"q":"يتقلب مزاجي بسرعة."},{"t":"O","k":1,"q":"أحب تجربة أطعمة وأماكن وأساليب جديدة."},{"t":"E","k":-1,"q":"أتحدث قليلًا عندما أكون في مجموعة."},{"t":"A","k":-1,"q":"لا تشغلني مشكلات الآخرين كثيرًا."},{"t":"C","k":-1,"q":"أؤجل الأعمال المهمة كثيرًا."},{"t":"N","k":-1,"q":"نادرًا ما أشعر بالحزن أو الإحباط."},{"t":"O","k":-1,"q":"لا أهتم كثيرًا بالفن والأدب."},{"t":"E","k":1,"q":"لا أمانع أن أكون محور الاهتمام."},{"t":"A","k":1,"q":"أسعى إلى التوافق وتجنب الخلافات غير الضرورية."},{"t":"C","k":1,"q":"أضع خطة واضحة قبل البدء في أي عمل."},{"t":"N","k":1,"q":"أتوتر بسهولة تحت الضغط."},{"t":"O","k":1,"q":"لدي خيال واسع وأحب التأمل."},{"t":"E","k":-1,"q":"أحتاج وقتًا لأستعيد طاقتي بعد اللقاءات الاجتماعية الطويلة."},{"t":"A","k":-1,"q":"أقدّم مصلحتي أولًا حتى لو تضرر غيري."},{"t":"C","k":-1,"q":"أنسى أحيانًا الوفاء بالتزاماتي."},{"t":"N","k":-1,"q":"أتعافى بسرعة بعد المواقف المزعجة."},{"t":"O","k":-1,"q":"أجد النقاشات الفلسفية مضيعة للوقت."}],"traits":{"O":{"name":"الانفتاح على الخبرة","short":"الانفتاح","what":"الفضول الفكري، والخيال، والإقبال على الجديد والتنوع.","hi":"عقل فضولي يحب الأفكار الجديدة والتجريب، ويرى الروابط بين المجالات. تزدهر في البيئات التي تكافئ الإبداع والتطوير، وقد تملّ من الروتين الطويل.","mid":"توازن بين تقدير الجديد والاعتماد على المجرَّب؛ تنفتح على الأفكار حين ترى فائدتها العملية.","lo":"تميل إلى الواقعية والعملية وتفضّل الأساليب المجرّبة. هذا مصدر ثبات وموثوقية، وقد يحتاج إلى مرونة أكبر عند التغيير.","tipHi":"حوّل أفكارك إلى خطط صغيرة قابلة للتنفيذ حتى لا تتشتت بين البدايات.","tipLo":"جرّب تغييرًا صغيرًا واحدًا كل شهر في طريقة عملك، وقيّم أثره بهدوء."},"C":{"name":"يقظة الضمير","short":"الانضباط","what":"التنظيم، والمثابرة، والالتزام بالمواعيد والمعايير.","hi":"منظم وموثوق، تفي بوعودك وتخطط قبل أن تعمل. هذه السمة من أقوى المنبئات بالأداء المهني، مع الحذر من الكمالية والجمود.","mid":"منضبط في الأمور المهمة، ومرن في التفاصيل الأقل أهمية.","lo":"عفوي ومرن وسريع التكيف، لكنك قد تعاني من التأجيل أو تشتت المهام.","tipHi":"ميّز بين ما يستحق الإتقان الكامل وما يكفيه (جيد بما يكفي).","tipLo":"اعتمد قائمة مهام يومية قصيرة (٣ أولويات) ومواعيد تسليم مكتوبة."},"E":{"name":"الانبساط","short":"الانبساط","what":"استمداد الطاقة من التفاعل الاجتماعي، والحماس، والمبادرة.","hi":"اجتماعي نشيط، تستمد طاقتك من الناس، وتبادر بالحديث والقيادة. تحتاج أحيانًا إلى الإصغاء أكثر وإفساح المجال للآخرين.","mid":"متوازن بين الاجتماعية والحاجة إلى الهدوء؛ تتكيف مع الموقف.","lo":"هادئ متأمل، تستعيد طاقتك في العزلة، وتفضّل العمق على الاتساع في العلاقات. قوتك في التركيز والإصغاء.","tipHi":"خصص في كل اجتماع لحظة لسؤال الأكثر صمتًا عن رأيه.","tipLo":"جهّز نقطتين قبل كل اجتماع لتضمن حضور صوتك دون استنزاف."},"A":{"name":"الوداعة (المقبولية)","short":"الوداعة","what":"التعاطف، والتعاون، والثقة بالآخرين، والميل إلى الانسجام.","hi":"متعاون متعاطف، يثق به الناس ويرتاحون إليه. احذر من صعوبة الرفض أو تغليب إرضاء الآخرين على مصلحة العمل.","mid":"تجمع بين التعاون والحزم؛ تراعي الآخرين دون أن تتنازل عن الأساسيات.","lo":"صريح وتنافسي ومستقل الرأي، مناسب للتفاوض واتخاذ القرارات الصعبة، وقد تحتاج إلى مزيد من اللين في التواصل.","tipHi":"تدرّب على الرفض اللبق: «أقدّر طلبك، ولا أستطيع هذه المرة».","tipLo":"ابدأ ملاحظاتك النقدية بما تقدّره فعلًا في عمل الآخر."},"N":{"name":"الاستقرار الانفعالي","short":"الاستقرار","what":"الهدوء تحت الضغط وسرعة التعافي من المواقف المزعجة (عكس العُصابية).","hi":"هادئ متزن تحت الضغط، تتعافى سريعًا من الإحباطات، ويستمد منك الآخرون الطمأنينة.","mid":"متزن غالبًا، وقد تتأثر في فترات الضغط الشديد.","lo":"حساس للضغوط، تشعر بالقلق أو تقلب المزاج بسهولة. هذه الحساسية قد تجعلك منتبهًا للمخاطر، لكنها تستحق إدارة واعية.","tipHi":"استثمر هدوءك في دعم الفريق وقت الأزمات، مع الانتباه لمشاعرك وعدم تجاهلها.","tipLo":"جرّب تقنية (سمّ الشعور ثم تنفس ببطء) وخصص وقتًا يوميًا للنشاط البدني ."},"INTP":{"n":"المفكر المحلل","s":"فضولي، تحليلي، يبحث عن الاتساق المنطقي في كل شيء. يحب النظريات والنماذج والأسئلة الصعبة.","st":["التحليل العميق","الأصالة الفكرية","الموضوعية"],"bl":["إهمال التنفيذ والتفاصيل العملية","الانعزال"],"wk":"البحث، والبرمجة، والتحليل، والتصميم المفاهيمي.","dev":"اختر فكرة واحدة وأكملها حتى التطبيق، وانتبه لمشاعر من تناقشهم."},"ESTP":{"n":"المبادر الواقعي","s":"نشيط، عملي، سريع البديهة. يحب الفعل والمخاطرة المحسوبة والنتائج الفورية.","st":["سرعة التصرف","المهارة في التفاوض","الواقعية"],"bl":["الاندفاع","الملل من التخطيط الطويل"],"wk":"المبيعات، وريادة الأعمال، والعمليات الميدانية، وإدارة الأزمات.","dev":"توقف لحظة قبل القرارات الكبيرة لتقيّم عواقبها البعيدة."},"ESFP":{"n":"المؤدي المرح","s":"حيوي، ودود، يحب الناس واللحظة الحاضرة. يضفي البهجة ويجيد التعامل العملي مع الآخرين.","st":["الحيوية والتفاؤل","المهارة الاجتماعية","العملية"],"bl":["تجنب المشكلات المزعجة","ضعف التخطيط المالي والزمني"],"wk":"خدمة العملاء، والفعاليات، والتسويق، والتدريب التفاعلي.","dev":"خصص وقتًا أسبوعيًا للتخطيط، وواجه المشكلات مبكرًا قبل أن تكبر."},"ENFP":{"n":"المتحمّس الملهِم","s":"متحمس، مبدع، يرى الإمكانات في الناس والأفكار. يلهم من حوله ويكره القيود.","st":["الإلهام والتحفيز","توليد الأفكار","التواصل الدافئ"],"bl":["التشتت بين المشاريع","إهمال التفاصيل"],"wk":"التدريب، والتسويق، والإعلام، والابتكار، وتنمية الموارد البشرية.","dev":"اعتمد نظامًا بسيطًا للمتابعة، واختر ثلاث أولويات فقط كل شهر."},"ENTP":{"n":"المبتكر المجادِل","s":"ذكي، سريع، يحب التحدي الفكري ويفكك الافتراضات. يرى حلولًا لا يراها غيره.","st":["الابتكار","المرونة الفكرية","مهارة الحجاج"],"bl":["الجدل للجدل","ضعف المتابعة"],"wk":"الاستشارات، وريادة الأعمال، وتطوير المنتجات، والاستراتيجية.","dev":"ميّز بين النقاش المثمر والجدل، وسلّم المتابعة لمن يتقنها."},"ESTJ":{"n":"المدير الحازم","s":"منظم، حاسم، يحب الإنجاز وفق معايير واضحة. يدير الناس والموارد بكفاءة.","st":["التنظيم والإدارة","الحسم","الالتزام بالمعايير"],"bl":["التصلب في الرأي","إغفال مشاعر الفريق"],"wk":"الإدارة التشغيلية، والامتثال، والمش S"]},{"q":"أكثر ما يحفزني:","o":["الاستقرار والأمان","الجودة والدقة","التحدي وتحقيق النتائج","التقدير والاعتراف"],"s":["S","C","D","I"]},{"q":"أكثر ما أتجنبه في العمل:","o":["التغيير المفاجئ","الرفض أو التجاهل","فقدان السيطرة على الأمور","الوقوع في الخطأ"],"s":["S","I","D","C"]},{"q":"عند اتخاذ قرار مهم:","o":["أستشير الناس وأتبع حماسي","أجمع أكبر قدر من المعلومات","أقرر بسرعة وأتحمل المسؤولية","أتمهل وأراعي أثره على الآخرين"],"s":["I","C","D","S"]},{"q":"أسلوبي في التواصل:","o":["حيوي ومعبّر","مباشر ومختصر","هادئ وودود","دقيق ومدعوم بالتفاصيل"],"s":["I","D","S","C"]},{"q":"عندما أتلقى تعليمات جديدة:","o":["أتحقق من تفاصيلها ومنطقها","أحتاج وقتًا لأعتاد عليها","أبحث عن أسرع طريق لتحقيق النتيجة","أشارك بها الآخرين ونتناقش فيها"],"s":["C","S","D","I"]},{"q":"بيئة العمل المثالية لي:","o":["فيها معايير واضحة ونظام","فيها صلاحيات وتحديات","فيها تعاون واستقرار","فيها تفاعل وتنوع"],"s":["C","D","S","I"]},{"q":"عند مواجهة مشكلة مفاجئة:","o":["أتصرف فورًا","أحافظ على هدوء الفريق وأتابع الحل خطوة خطوة","أحلل أسبابها قبل التصرف","أجمع الناس لنحلها معًا"],"s":["D","S","C","I"]},{"q":"أقوى ما أسهم به في الفريق:","o":["الإلهام والتحفيز","التحليل والتدقيق","القيادة والحسم","الدعم والوفاء"],"s":["I","C","D","S"]},{"q":"في وقت الفراغ أفضّل:","o":["نشاطًا فيه منافسة","وقتًا هادئًا مع العائلة","قراءة أو هواية تتطلب إتقانًا","لقاءً مع الأصدقاء"],"s":["D","S","C","I"]},{"q":"عندما أقود فريقًا:","o":["أهتم بانسجام الفريق وراحة أعضائه","أضع إجراءات ومعايير واضحة","أضع أهدافًا طموحة وأتابع النتائج","أحفّز الفريق وأحتفي بالنجاحات"],"s":["S","C","D","I"]},{"q":"نقطة الضعف التي قد يلاحظها الآخرون علي:","o":["الإفراط في التدقيق","نفاد الصبر","صعوبة قول (لا)","قلة المتابعة للتفاصيل"],"s":["C","D","S","I"]},{"q":"عندما يعارضني أحد:","o":["أطلب منه الدليل وأقدّم دليلي","أدافع عن رأيي بقوة","أتنازل حفاظًا على العلاقة","أحاول إقناعه بحماس"],"s":["C","D","S","I"]},{"q":"في كتابة التقارير:","o":["أجعلها جذابة وسهلة القراءة","أركز على الخلاصة والتوصيات","أتأكد أنها تلبي حاجة من سيقرؤها","أحرص على دقة function shapeSVG(sh,cx,cy,r,f){
  const fill = f==="solid"?"currentColor":f==="striped"?"url(#stripes)":"none";
  const st=`fill="${fill}" stroke="currentColor" stroke-width="2"`;
  const poly=(n,rot)=>Array.from({length:n},(_,i)=>{const a=rot+i*2*Math.PI/n;return (cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1);}).join(" ");
  switch(sh){
    case "circle": return `<circle cx="${cx}" cy="${cy}" r="${r*0.92}" ${st}/>`;
    case "square": {const s=r*1.6;return `<rect x="${cx-s/2}" y="${cy-s/2}" width="${s}" height="${s}" ${st}/>`;}
    case "triangle": return `<polygon points="${poly(3,-Math.PI/2)}" transform="translate(0 ${r*0.15})" ${st}/>`;
    case "diamond": return `<polygon points="${poly(4,-Math.PI/2)}" ${st}/>`;
    case "hexagon": return `<polygon points="${poly(6,0)}" ${st}/>`;
  }
}
const POS={1:[[0,0]],2:[[-.24,-.22],[.24,.22]],3:[[0,-.26],[-.26,.2],[.26,.2]]};
const BASE={1:.34,2:.19,3:.165}, SZ={s:.6,m:.8,l:1};
function cellSVG(s,x,y,C){
  if(!s) return `<text x="${x+C/2}" y="${y+C/2+14}" text-anchor="middle" font-size="40" font-family="Reem Kufi,sans-serif" fill="currentColor" opacity=".55">؟</text>`;
  const r=C*BASE[s.n]*SZ[s.z];
  return POS[s.n].map(([dx,dy])=>shapeSVG(s.sh,x+C/2+dx*C,y+C/2+dy*C,r,s.f)).join("");
}
function matrixSVG(cells){
  const C=84,G=6,W=3*C+4*G;
  let o=`<svg viewBox="0 0 ${W} ${W}" width="${W}" role="img" aria-label="مصفوفة أشكال ٣×٣ بخانة فارغة">`;
  for(let i=0;i<9;i++){const r=Math.floor(i/3),c=i%3;const x=W-G-(c+1)*C-c*G,y=G+r*(C+G);
    o+=`<rect x="${x}" y="${y}" width="${C}" height="${C}" rx="8" fill="var(--surface)" stroke="var(--line)" ${i===8?'stroke-dasharray="5 4" stroke-width="2"':''}/>`+cellSVG(cells[i]||null,x,y,C);}
  return o+"</svg>";
}
function oneCellSVG(s){const C=84;return `<svg viewBox="0 0 ${C} ${C}" role="img" aria-label="خيار">`+cellSVG(s,0,0,C)+"</svg>";}
function polySVG(cells,big){
  const U=big?26:20,P=6,n=4,W=n*U+2*P;
  const h=Math.max(...cells.map(p=>p[0]))+1,w=Math.max(...cells.map(p=>p[1]))+1;
  const ox=P+(n-w)*U/2, oy=P+(n-h)*U/2;
  let o=`<svg viewBox="0 0 ${W} ${W}" ${big?`width="${W*1.6}"`:""} role="img" aria-label="شكل مكوّن من مربعات">`;
  for(const [r,c] of cells) o+=`<rect x="${(ox+c*U).toFixed(1)}" y="${(oy+r*U).toFixed(1)}" width="${U}" height="${U}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" rx="2"/>`;
  return o+"</svg>";
}

/* ============ التصحيح ============ */
function scoreIQ(id){
  const t=T(id), K=getKey()[id], items=itemsOf(id), A=answers(id);
  let raw=0; const cat={};
  items.forEach((it,i)=>{
    const c=cat[it.c] ||= {got:0,max:0};
    const pts = t.w ? (A[i]===null?0:K[i].w[A[i]]) : (A[i]===K[i].a?1:0);
    raw+=pts; c.got+=pts; c.max+= t.w?3:1;
  });
  const iq=Math.max(55,Math.min(145,Math.round(100+15*(raw-t.norm.m)/t.norm.sd)));
  return {raw,iq,cat,pct:pctile(iq)};
}
function scoreBig5(){
  const A=answers("bigfive"), s={O:0,C:0,E:0,A:0,N:0};
  DATA.bigfive.items.forEach((it,i)=>{const v=(A[i]??2)+1; let x=it.k===1?v:6-v; if(it.t==="N") x=6-x; s[it.t]+=x;});
  const out={}; for(const k in s){const p=Math.round((s[k]-6)/24*100); out[k]={raw:s[k],p,lv:p>65?"hi":p<35?"lo":"mid"};} return out;
}
function scoreTypes(){
  const A=answers("types"), tot={EI:0,SN:0,TF:0,JP:0}, n={EI:0,SN:0,TF:0,JP:0};
  DATA.types.items.forEach((it,i)=>{const v=2-(A[i]??2); const first=it.d[0]; tot[it.d]+= it.p===first? v : -v; n[it.d]++;});
  let code=""; const dims={};
  for(const d of ["EI","SN","TF","JP"]){const L=tot[d]>0?d[0]:d[1]; code+=L; dims[d]={L,firstPct:Math.round(50+tot[d]/(2*n[d])*50)};}
  return {code,dims};
}
function scoreDISC(){
  const A=answers("disc"), c={D:0,I:0,S:0,C:0};
  DATA.disc.items.forEach((it,i)=>{if(A[i]!==null)c[it.s[A[i]]]++;});
  const order=Object.keys(c).sort((a,b)=>c[b]-c[a]||"DISC".indexOf(a)-"DISC".indexOf(b));
  return {c,order};
}

/* ============ النتائج ============ */
function bellSVG(iq,color){
  const W=640,H=190,x0=30,x1=W-30,base=150,top=22;
  const X=v=>x0+(v-55)/(145-55)*(x1-x0);
  const pdf=v=>Math.exp(-((v-100)**2)/(2*225));
  const pts=[];for(let v=55;v<=145;v+=1)pts.push([X(v),base-(base-top)*pdf(v)]);
  const seg=(a,b,c)=>{const p=pts.filter(q=>q[0]>=X(a)-.01&&q[0]<=X(b)+.01);return `<path d="M${X(a)},${base} L${p.map(q=>q.join(",")).join(" L")} L${X(b)},${base} Z" fill="var(${c})" opacity=".22"/>`;};
  const regions=[[55,80,"--b1"],[80,90,"--b2"],[90,110,"--b3"],[110,120,"--b4"],[120,130,"--b5"],[130,145,"--b6"]];
  let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="موقع الدرجة ${iq} على منحنى التوزيع الطبيعي">`;
  o+=regions.map(r=>seg(...r)).join("");
  o+=`<path d="M${pts.map(q=>q.join(",")).join(" L")}" fill="none" stroke="var(--muted)" stroke-width="1.5"/>`;
  o+=`<line x1="${x0}" y1="${base}" x2="${x1}" y2="${base}" stroke="var(--line)" stroke-width="1.5"/>`;
  for(const v of [70,80,90,100,110,120,130,140]) o+=`<line x1="${X(v)}" y1="${base}" x2="${X(v)}" y2="${base+5}" stroke="var(--muted)"/><text x="${X(v)}" y="${base+22}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="IBM Plex Sans Arabic,sans-serif">${ar(v)}</text>`;
  const labels=[[67,"ضعيف"],[85,"أقل"],[100,"متوسط"],[115,"جيد"],[125,"مرتفع"],[137.5,"عبقري"]];
  for(const [v,l] of labels) o+=`<text x="${X(v)}" y="${base-6}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans Arabic,sans-serif">${l}</text>`;
  const xm=X(iq), ym=base-(base-top)*pdf(iq);
  o+=`<line x1="${xm}" y1="${top-8}" x2="${xm}" y2="${base}" stroke="var(${color})" stroke-width="2.5"/><circle cx="${xm}" cy="${ym}" r="6" fill="var(${color})" stroke="var(--surface)" stroke-width="2"/>`;
  o+=`<text x="${Math.min(Math.max(xm,50),W-50)}" y="${top-12}" text-anchor="middle" font-size="14" font-weight="700" fill="var(${color})" font-family="Reem Kufi,sans-serif">${ar(iq)}</text>`;
  return o+"</svg>";
}
function catBars(t,cat){
  return `<div class="bars">${Object.entries(t.cats).map(([k,c])=>{const s=cat[k];if(!s)return"";const p=Math.round(s.got/s.max*100);
    return `<div class="bar-row"><span>${c.n}</span><div class="bar"><i style="width:${p}%;background:${p>=75?"var(--b5)":p>=50?"var(--b4)":p>=35?"var(--b2)":"var(--b1)"}"></i></div><span class="v num">${ar(p)}٪</span></div>`;}).join("")}</div>`;

function reviewBlock(t){
  if(!review.open) return `<section class="panel"><h3>مراجعة الإجابات (للمدرب)</h3><p class="muted">مفتاح الإجابات والتفسيرات محمي حتى لا تنكشف الأسئلة لمن سيخضع للمقياس لاحقًا. أدخل رمز المدرب لعرضها.</p>

  const K=getKey()[t.id], items=itemsOf(t.id), A=answers(t.id);
  const rows=items.map((it,i)=>{
    const u=A[i]; let ok,mark,ansTxt,best;
    if(t.w){const w=K[i].w; ok=w[u]===3; best=w.indexOf(3); mark=`<span class="${w[u]>=2?"ok":"no"} num">${ar(w[u]??0)} / ${ar(3)}</span>`;
      ansTxt=`<p>إجابتك: ${esc(it.o[u])}</p>${ok?"":`<p>الإجابة الأفضل: <b>${esc(it.o[best])}</b></p>`}`;}
    else {ok=u===K[i].a; mark=`<span class="${ok?"ok":"no"}">${ok?"صحيحة":"خاطئة"}</span>`;
      if(t.fmt==="fig"){const f=it.t==="mat"?oneCellSVG:polySVG; ansTxt=`<div class="figs">${it.t==="mat"?matrixSVG(it.cells):polySVG(it.base)}<span>إجابتك (${LET[u]}):</span>${f(it.opts[u])}${ok?"":`<span>الصحيحة (${LET[K[i].a]}):</span>${f(it.opts[K[i].a])}`}</div>`;}
      else ansTxt=`<p>إجابتك: ${esc(it.o[u])}</p>${ok?"":`<p>الإجابة الصحيحة: <b>${esc(it.o[K[i].a])}</b></p>`}`;}
    return `<div class="rv"><div class="h"><span class="eyebrow num">السؤال ${ar(i+1)} · ${t.cats[it.c].n}</span>${mark}</div><p class="q">${esc(it.q)}</p>${ansTxt}<p class="e">${esc(K[i].e)}</p></div>`;
  }).join("");
  return `<section class="panel"><h3>مراجعة الإجابات والتفسيرات</h3><div class="review">${rows}</div></section>`;
}

  const iqs=TESTS.filter(t=>t.kind==="iq"&&store.done[t.id]).map(t=>({t,r:scoreIQ(t.id)}));
  const cog=iqs.filter(x=>["logic","numeric","verbal","spatial"].includes(x.t.id));
  const avg=a=>Math.round(a.reduce((s,x)=>s+x.r.iq,0)/a.length);
  let rows=iqs.map(({t,r})=>{const b=bandOf(r.iq);return `<tr><td>${t.name}</td><td class="num"><b>${ar(r.iq)}</b></td><td style="color:var(${b.c});font-weight:600">${b.label}</td><td class="num">${ar(Math.round(r.pct))}٪</td></tr>`;}).join("");
  const pers=[];
  if(store.done.types){const r=scoreTypes();pers.push(`<li><b>الأنماط الستة عشر:</b> <span dir="ltr">${r.code}</span> — ${DATA.types.types[r.code].n}</li>`);}
  if(store.done.disc){const r=scoreDISC();pers.push(`<li><b>DISC:</b> ${r.order[0]}/${r.order[1]} — ${DATA.disc.blends[r.order[0]+r.order[1]]}</li>`);}
  if(store.done.bigfive){const s=scoreBig5(),TR=DATA.bigfive.traits;pers.push(`<li><b>العوامل الخمسة:</b> ${["O","C","E","A","N"].map(k=>`${TR[k].short} ${ar(s[k].p)}٪`).join(" · ")}</li>`);}
  const comp=cog.length?(()=>{const v=avg(cog),b=bandOf(v);return `<section class="res-hero" style="--bandc:var(${b.c})"><div class="score"><div class="big num">${ar(v)}</div><div class="lbl">المؤشر المعرفي العام</div></div><div><span class="band">${b.label}</span><p>متوسط ${ar(cog.length)} من مقاييس القدرات المعرفية الأربعة (المنطقي، العددي، اللغوي، البصري).${cog.length<4?" أكمل البقية للحصول على مؤشر أدق.":""}</p></div></section>`;})():"";
  return header()+`
  <div class="testbar"><div><span class="eyebrow">خلاصة كل ما أكملته</span><h2>ملفي الشامل</h2></div></div>
  ${comp}
  <section class="panel"><h3>مقاييس الذكاء</h3>${rows?`<div class="tablewrap"><table class="prof-table"><thead><tr><th>المقياس</th><th>الدرجة</th><th>التصنيف</th><th>أعلى من</th></tr></thead><tbody>${rows}</tbody></table></div>`:`<div class="empty">لم تُكمل أي مقياس للذكاء بعد.</div>`}</section>
  <section class="panel"><h3>مقاييس الشخصية</h3>${pers.length?`<ul class="clean">${pers.join("")}</ul>`:`<div class="empty">لم تُكمل أي مقياس للشخصية بعد.</div>`}</section>
  <div class="actions"><button class="btn" data-go="home">→ العودة إلى المقاييس</button></div>`;
}

function render(){
  const app=$("#app");
  if(view.name==="home") app.innerHTML=home();
  else if(view.name==="profile") app.innerHTML=profile();
  else if(view.name==="test") app.innerHTML=qView();
  else if(view.name==="result"){
    const id=view.id;
    app.innerHTML = T(id).kind==="iq"?iqResult(): id==="bigfive"?big5Result(): id==="types"?typesResult(): discResult();
  }
}

/* ============ التفاعل ============ */
let advTimer=null;
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.dataset.go){resetArm=null;return go(b.dataset.go);}
  if(b.dataset.open){const id=b.dataset.open;review.open=false;review.err=false;resetArm=null;return go(store.done[id]?"result":"test",id);}
  if(b.dataset.ans!==undefined){
    const id=view.id, A=answers(id), i=store.idx[id]||0; A[i]=+b.dataset.ans; save();
    clearTimeout(advTimer); render();
    if(i<29) advTimer=setTimeout(()=>{store.idx[id]=Math.min(29,i+1);save();render();},260);
    return;
  }
  if(b.dataset.step){clearTimeout(advTimer);const id=view.id;store.idx[id]=Math.max(0,Math.min(29,(store.idx[id]||0)+ +b.dataset.step));save();return render();}
  if(b.dataset.jump){clearTimeout(advTimer);store.idx[view.id]=+b.dataset.jump;save();return render();}
  if(b.dataset.finish){store.done[view.id]=true;save();review.open=false;return go("result",view.id);}
  if(b.dataset.reset){const id=b.dataset.reset;
    if(resetArm!==id){resetArm=id;return render();}
    resetArm=null;delete store.done[id];store.ans[id]=new Array(30).fill(null);store.idx[id]=0;save();return go("test",id);}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="lockf")return; e.preventDefault();
  if(fnv(normAr($("#code").value||""))===CODEHASH){review.open=true;review.err=false;}else{review.err=true;}
  render();
});
document.addEventListener("keydown",e=>{
  if(view.name!=="test"||e.target.tagName==="INPUT")return;
  const n="123456".indexOf(e.key); const ai="١٢٣٤٥٦".indexOf(e.key); const k=n>=0?n:ai;
  if(k>=0){const btn=document.querySelector(`[data-ans="${k}"]`); if(btn) btn.click();}
});
render();
</script>
