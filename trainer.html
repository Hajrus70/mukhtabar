<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F6F8F8; --ink:#14232A; --muted:#5A6B71; --line:#D5DEDC;
  --accent:#0E6B60; --accent-ink:#FFFFFF; --accent-soft:#DDEFEB; --amber:#A8691A; --amber-soft:#F6E9D5;
  --b1:#B04A35; --b2:#C2842A; --b3:#7E8F93; --b4:#3A9483; --b5:#1D7A6D; --b6:#0B5A50;
  --focus:#C2842A; --shadow:0 1px 2px rgba(20,35,42,.06),0 6px 24px -12px rgba(20,35,42,.18);
  --display:"Reem Kufi","IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Geeza Pro",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1517; --surface:#142024; --surface-2:#18262B; --ink:#E2EAE8; --muted:#94A6A9; --line:#26383D;
    --accent:#3CB6A2; --accent-ink:#06201C; --accent-soft:#163632; --amber:#E2A54B; --amber-soft:#3A2B14;
    --b1:#E07A62; --b2:#E2A54B; --b3:#9AABAE; --b4:#5CC0AD; --b5:#3CB6A2; --b6:#8BE0CF;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1517; --surface:#142024; --surface-2:#18262B; --ink:#E2EAE8; --muted:#94A6A9; --line:#26383D;
  --accent:#3CB6A2; --accent-ink:#06201C; --accent-soft:#163632; --amber:#E2A54B; --amber-soft:#3A2B14;
  --b1:#E07A62; --b2:#E2A54B; --b3:#9AABAE; --b4:#5CC0AD; --b5:#3CB6A2; --b6:#8BE0CF;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7;margin:0}
#app{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;text-align:right}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.35;margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 16px;border-bottom:1px solid var(--line);margin-bottom:22px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:40px;height:40px;flex:none}
.brand h1{font-size:23px}
.brand p{margin:0;font-size:13px;color:var(--muted)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.warn{border-color:var(--b1);color:var(--b1)}
.btn.sm{padding:3px 10px;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:16px}
.filters label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 10px;font-size:14px;max-width:100%}
.filters input{width:200px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .v{font-family:var(--display);font-size:30px;font-weight:700;line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.panel h3{font-size:18px;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle;white-space:nowrap}
th{font-size:12.5px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
th[data-sort]{cursor:pointer}
th[data-sort]:hover{color:var(--accent)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.wrap{white-space:normal;min-width:180px}
.pill{display:inline-block;border-radius:999px;padding:0 10px;font-size:12.5px;font-weight:600;border:1px solid transparent}
.pill.done{background:var(--accent-soft);color:var(--accent)}
.pill.prog{background:var(--amber-soft);color:var(--amber)}
.pill.start{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.band{font-weight:600}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);min-width:140px}
.stack i{display:block;height:100%}
.hbars{display:grid;gap:9px}
.hb{display:grid;grid-template-columns:minmax(110px,170px) 1fr 44px;gap:10px;align-items:center;font-size:14px}
.hb .t{height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--accent);border-radius:99px}
.hb .n{text-align:left;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:10px;height:10px;border-radius:3px;display:inline-block}
.feed{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.feed li{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:6px;flex-wrap:wrap}
.person-h{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.person-h h2{font-size:26px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted);margin-top:6px}
.meta b{color:var(--ink);font-weight:600}
.att{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.att .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.att h4{font-family:var(--display);font-size:17px;font-weight:600;margin:0}
.att .score{font-family:var(--display);font-size:36px;font-weight:700;line-height:1}
.att .small{font-size:13px;color:var(--muted)}
.review{display:grid;gap:8px;margin-top:8px}
.rv{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface-2);font-size:14px}
.rv .q{font-weight:600}
.ok{color:var(--b5);font-weight:700}
.no{color:var(--b1);font-weight:700}
.login{max-width:420px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:var(--shadow)}
.login h2{font-size:24px;margin-bottom:8px}
.login input{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:12px 0}
.err{color:var(--b1);font-size:14px}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.note{font-size:13.5px;color:var(--muted)}
.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
@media (max-width:980px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:700px){.kpis{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}.filters input{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app" dir="rtl" lang="ar"></div>

<script>
const TESTS=[
 {id:"logic",kind:"iq",fmt:"mc",code:"ذ١",name:"الذكاء المنطقي",dom:"التفكير المنطقي والاستدلال",
  desc:"يقيس قدرتك على الاستنتاج السليم من المقدمات، وترتيب العلاقات، واكتشاف القواعد، وحل المشكلات المركبة.",
  cats:{ded:{n:"الاستدلال القياسي",tip:"ارسم المقدمات في دوائر متداخلة (أشكال فِن) قبل الحكم، وميّز بين ما يلزم حتمًا وما قد يكون."},
        ord:{n:"الترتيب والعلاقات",tip:"دوّن العلاقات على خط أو مخطط بسيط بدل الاحتفاظ بها كلها في الذهن."},
        code:{n:"الرموز والقواعد",tip:"ابدأ بالعنصر المشترك بين الأمثلة، ثم اختبر القاعدة المقترحة على كل مثال قبل اعتمادها."},
        prob:{n:"حل المشكلات",tip:"جزّئ المسألة، وجرّب الحالة الأسوأ، واختبر الفرضيات بالافتراض المضاد (ماذا لو كان العكس صحيحًا؟)."}},
  use:"التحليل، والتدقيق، وإدارة المخاطر، وصياغة السياسات والإجراءات، والتخطيط.",
  norm:{m:16,sd:5},max:30},
 {id:"numeric",kind:"iq",fmt:"mc",code:"ذ٢",name:"الذكاء الرياضي العددي",dom:"التفكير الكمي والعددي",
  desc:"يقيس سرعة إدراك الأنماط العددية، والحساب والنسب، وتحويل المسائل الكلامية إلى معادلات، والحدس الكمي.",
  cats:{ser:{n:"المتسلسلات العددية",tip:"افحص بالترتيب: الفروق، ثم النسب، ثم الأنماط المتداخلة والمتناوبة."},
        calc:{n:"الحساب والنسب",tip:"تدرّب على الحساب الذهني للنسب المئوية بتحويلها إلى كسور (٢٥٪ = ربع)."},
        word:{n:"المسائل الكلامية",tip:"حوّل كل مسألة إلى رموز ومعادلة قبل البدء بالحساب."},
        ins:{n:"الحدس الكمي",tip:"عندما يبدو الجواب بديهيًا وسريعًا، تحقّق منه بالتعويض في معطيات المسألة."}},
  use:"التحليل المالي، والميزانيات، وقراءة المؤشرات، والنمذجة الكمية، واتخاذ القرار بالأرقام.",
  norm:{m:15,sd:5.5},max:30},
 {id:"verbal",kind:"iq",fmt:"mc",code:"ذ٣",name:"الذكاء اللغوي",dom:"الفهم اللغوي والتعبير",
  desc:"يقيس ثروتك من المفردات العربية، وإدراك العلاقات بين الكلمات، والتصنيف اللفظي، وفهم النصوص والأمثال.",
  cats:{voc:{n:"المفردات والدلالة",tip:"اقرأ يوميًا نصًا عربيًا رفيعًا، ودوّن ثلاث كلمات جديدة مع مرادفها وضدها."},
        ana:{n:"التناظر اللفظي",tip:"سمِّ العلاقة في الزوج الأول بجملة (أداة/مستخدم، جزء/كل، ضد...) ثم طبّقها على الثاني."},
        cls:{n:"التصنيف اللفظي",tip:"ابحث عن الصفة الجامعة لثلاث كلمات، فالمختلفة هي التي تخرج عنها."},
        com:{n:"الاستيعاب والفهم",tip:"لخّص كل نص تقرؤه في جملة واحدة، وميّز الفكرة الرئيسة عن التفاصيل."}},
  use:"الكتابة، والتأليف، والتدريب، والعرض والإقناع، وصياغة التقارير.",
  norm:{m:17,sd:5},max:30},
 {id:"spatial",kind:"iq",fmt:"fig",code:"ذ٤",name:"الذكاء البصري المكاني",dom:"الاستدلال البصري المجرد",
  desc:"يقيس إدراك القواعد في الأشكال المجردة (المصفوفات) والتدوير الذهني للأشكال، وهو أقرب المقاييس إلى الذكاء العام غير اللفظي.",
  cats:{mat:{n:"المصفوفات والاستدلال المجرد",tip:"افحص كل خاصية على حدة (الشكل، العدد، التعبئة، الحجم) صفًّا صفًّا ثم عمودًا عمودًا."},
        rot:{n:"التدوير الذهني",tip:"اختر خلية مميزة في الشكل (طرفًا أو زاوية) وتتبّع موقعها بعد التدوير بدل تدوير الشكل كله."}},
  use:"التصميم، وقراءة المخططات والخرائط، وفهم الأنظمة المعقدة، والتخطيط المكاني.",
  norm:{m:15,sd:5.5},max:30},
 {id:"eq",kind:"iq",fmt:"mc",w:true,code:"ذ٥",name:"الذكاء العاطفي",dom:"إدراك المشاعر وإدارتها",
  desc:"مواقف واقعية تقيس الوعي بالذات، وإدارة الانفعالات، والدافعية الذاتية، والتعاطف، وفهم المشاعر (نموذج جولمان وماير-سالوفي).",
  cats:{aware:{n:"الوعي بالذات",tip:"خصص دقيقتين يوميًا لتسمية شعورك بدقة وسببه: «أشعر بـ... لأن...»."},
        reg:{n:"إدارة الانفعالات",tip:"اعتمد قاعدة (توقف – تنفس – اختر): لا ترد في ذروة الانفعال، ولا تُرسل رسالة وأنت غاضب."},
        mot:{n:"الدافعية الذاتية",tip:"اربط أهدافك بقيمة تهمك، وقسّمها إلى مراحل قصيرة تحتفي بإنجاز كل منها."},
        emp:{n:"التعاطف",tip:"في الحوار القادم، أصغِ حتى تستطيع أن تعيد كلام محدثك ومشاعره بكلماتك قبل أن تنصح."},
        und:{n:"فهم المشاعر",tip:"وسّع مفرداتك الشعورية: ميّز بين الضيق والإحباط والاستياء والقلق، وتأمل كيف يتحول شعور إلى آخر."}},
  use:"القيادة، والتدريب، والإرشاد، وإدارة الفرق، والتعامل مع العملاء وقت الأزمات.",
  norm:{m:64,sd:10},max:90},
 {id:"social",kind:"iq",fmt:"mc",w:true,code:"ذ٦",name:"الذكاء الاجتماعي",dom:"فهم الناس والتعامل معهم",
  desc:"مواقف تقيس قراءة الإشارات الاجتماعية، وفهم الأعراف والسياق، وإدارة الخلاف، والتأثير والإقناع، وديناميكيات الجماعة.",
  cats:{cue:{n:"قراءة الإشارات الاجتماعية",tip:"راقب في كل لقاء التوافق بين الكلام ونبرة الصوت ولغة الجسد، وتحقق من انطباعك بسؤال لطيف."},
        norm:{n:"فهم السياق والأعراف",tip:"قبل أي موقف جديد، اسأل: من صاحب المقام هنا؟ وما المتوقع مني؟"},
        conf:{n:"إدارة الخلاف",tip:"افصل الشخص عن المشكلة، وابحث عن المصلحة الكامنة خلف كل موقف."},
        infl:{n:"التأثير والإقناع",tip:"قدّم فكرتك بلغة أولويات من تخاطبه، وادعمها بدليل ومثال صغير ناجح."},
        grp:{n:"ديناميكيات الجماعة",tip:"راقب من يتكلم ومن يصمت في الاجتماعات، ووزّع فرص المشاركة بعدل."}},
  use:"القيادة، والتفاوض، وخدمة العملاء، والتدريب، وبناء الشبكات المهنية.",
  norm:{m:64,sd:10},max:90},
 {id:"bigfive",kind:"pers",fmt:"likert",code:"ش١",name:"العوامل الخمسة الكبرى",dom:"",
  desc:"النموذج الأوسع قبولًا في علم النفس الحديث: الانفتاح، ويقظة الضمير، والانبساط، والوداعة، والاستقرار الانفعالي.",
  chips:["الانفتاح","الانضباط","الانبساط","الوداعة","الاستقرار"]},
 {id:"types",kind:"pers",fmt:"bipolar",code:"ش٢",name:"الأنماط الستة عشر",dom:"",
  desc:"مبني على نظرية الأنماط النفسية ليونغ: كيف تستمد طاقتك، وكيف تجمع المعلومات، وكيف تقرر، وكيف تنظم حياتك.",
  chips:["E / I","S / N","T / F","J / P"]},
 {id:"disc",kind:"pers",fmt:"disc",code:"ش٣",name:"أنماط السلوك DISC",dom:"",
  desc:"يصف أسلوبك السلوكي في العمل والتواصل: الهيمنة، والتأثير، والثبات، والامتثال والدقة.",

فعّالًا؟","o":["أعيد لها الكلمة: «أظن أن زميلتنا لم تكمل فكرتها»","أخبرها بعد الاجتماع أنني لاحظت ذلك","أتجاهل الأمر لأنه ليس من شأني","أنصحها بأن تكون أكثر حزمًا"],"c":"emp"},{"q":"تتعلم مهارة جديدة، وتقدّمك بطيء. ما الأنسب؟","o":["أستنتج أنني لا أملك الموهبة وأتوقف","أقارن نفسي بالمتميزين لأحفّز نفسي","أقيس تقدمي بمقارنة نفسي بالأمس، وأحدد أهدافًا صغيرة قابلة للقياس","أبحث عن مدرب أو مصدر تعلم أفضل"],"c":"mot"},{"q":"في نقاش عائلي حاد، بدأ صوتك يرتفع. ما أفضل تصرف؟","o":["أرفع صوتي أكثر ليُسمع رأيي","أصمت حتى ينتهي النقاش","أطلب استراحة قصيرة، وأعود للنقاش حين أهدأ","أخفض صوتي وأواصل"],"c":"reg"},{"q":"وصلتك رسالة مستفزة من عميل وأنت غاضب. ما الأنسب؟","o":["أكتب مسودة ولا أرسلها حتى أهدأ، ثم أراجعها مركزًا على حل المشكلة","أرد فورًا لأوضح له خطأه","أطلب من زميل أن يرد بدلًا مني","أؤجل الرد عدة أيام"],"c":"reg"},{"q":"لاحظت أنك ترد بحدّة على زملائك في الأيام التي تنام فيها قليلًا. ما التصرف الأنسب؟","o":["أعترف لنفسي بهذا النمط، وأنتبه لحالتي في تلك الأيام، وأؤجل النقاشات الحساسة","هذا طبعي، وعلى الآخرين أن يتقبلوه","أحاول أن أنام أكثر دون أن أغيّر شيئًا في تعاملي","أعتذر لمن رددت عليه بحدة بعد وقوع الموقف"],"c":"aware"},{"q":"فقد إنسان شيئًا ثمينًا، ويشعر أنه كان بإمكانه منع ذلك. ما الشعور الأرجح؟","o":["الدهشة","الخوف","الندم","الحزن"],"c":"und"},{"q":"أخبرك صديق بأنه فقد وظيفته. ما أول استجابة أنسب؟","o":["أحكي له عن مرة فقدت فيها وظيفتي وكانت أصعب","أعرض عليه المساعدة في البحث عن عمل","أخبره أن الأمر ليس بهذا السوء وأن الوظائف كثيرة","أنصت إليه، وأعبّر عن تفهمي لصعوبة الموقف قبل تقديم أي نصيحة"],"c":"emp"},{"q":"تأخرت رحلتك ساعات، وستفوتك مناسبة مهمة. ما الأجدى؟","o":["أتقبل انزعاجي، ثم أركز على ما يمكنني فعله: إبلاغ أصحاب المناسبة والبحث عن بدائل","أتشاجر مع موظف المكتب","أنتظر وأنا أتذمر من شركة الطيران","أتصل بأصحاب المناسبة للاعتذار"],"c":"reg"},{"q":"تلقيت ملاحظة من مديرك بأن عروضك التقديمية طويلة. ما الاستجابة الأكثر نضجًا؟","o":["أوضح له أن الموضوع يتطلب التفصيل","أشكره وأختصر العرض القادم","أستنتج أنه لا يقدّر جهدي","أطلب أمثلة محددة، وأراجع عروضي السابقة لأتحقق من الملاحظة"],"c":"aware"},{"q":"ما الشعور الذي يجمع بين الحزن والشوق إلى ما مضى؟","o":["الحنين","الندم","الغيرة","القلق"],"c":"und"},{"q":"قيل لك إنك تبدو غاضبًا في الاجتماعات، بينما تشعر أنك هادئ. ما الأنسب؟","o":["الآخرون يسيئون فهمي، ولا شيء علي فعله","أحرص على الابتسام أكثر","أعدّ ذلك مؤشرًا على فجوة بين ما أشعر به وما تعكسه تعابيري، وأنتبه لها","أسأل زميلًا موثوقًا عن التعابير التي لاحظها"],"c":"aware"},{"q":"أي العبارات التالية تعبّر عن وعي ذاتي أعلى؟","o":["«أنا متوتر بسبب ضغط العمل»","«أنا متوتر لأنني أخشى ألا يكون عملي بالمستوى المطلوب»","«أشعر بالتوتر»","«هذا العمل سيئ»"],"c":"aware"},{"q":"موظف كان يخشى تقييمًا قادمًا، ثم علم أن التقييم تأجل. ما الشعور الأرجح؟","o":["الارتياح","الفرح","الملل","الإحباط"],"c":"und"},{"q":"عاد طفلك من المدرسة منفعلًا يشكو من معلمه. ما الاستجابة الأكثر تعاطفًا وحكمة؟","o":["أخبره بأن المعلم دائمًا على حق","أستمع إليه وأعترف بمشاعره، ثم أسمع رواية المعلم قبل الحكم","أهدّئه وأعده بأنني سأتحدث مع المعلم","أذهب للمدرسة غاضبًا للدفاع عنه"],"c":"emp"},{"q":"أمامك مهمة مملة لكنها ضرورية، وتشعر برغبة في تأجيلها. ما الأنفع؟","o":["أنتظر حتى أشعر بالرغبة في العمل","أؤجلها إلى آخر لحظة","أقسّمها إلى أجزاء صغيرة، وأبدأ بأولها الآن، مع مكافأة بسيطة بعد الإنجاز","أحدد لها موعدًا ثابتًا في جدولي"],"c":"reg"},{"q":"لم تحصل على ترقية تراها مستحقة. ما الاستجابة الأنفع على المدى البعيد؟","o":["أواصل عملي بالمستوى نفسه وأنتظر الفرصة القادمة","أطلب تغذية راجعة واضحة عن المعايير، وأضع خطة لسد الفجوات","أقلل جهدي لأن الجهد لا يُقدَّر","أبحث فورًا عن عمل آخر"],"c":"mot"},{"q":"طُلب منك تحسين إجراء عمل ليس من مسؤولياتك المباشرة. ماذا يفعل غالبًا صاحب الدافعية الذاتية العالية؟","o":["يقبل بشرط الحصول على مقابل","يرحب بالفرصة للتعلم وإضافة القيمة، مع تنسيق أولوياته","يرفض لأنها ليست من مسؤولياته","يقبل ويؤدي الحد المطلوب"],"c":"mot"},{"q":"تعرف أنك تميل إلى قبول مهام تفوق وقتك لأنك تكره الرفض. ما الأنفع؟","o":["أقبل المهام ثم أعمل ساعات إضافية لإنجازها","أحدد مسبقًا حدود طاقتي، وأطلب مهلة للتفكير قبل قبول أي مهمة جديدة","أناقش أولوياتي الحالية مع مديري عند كل طلب جديد","أقبل ثم أنجز المهام بجودة أقل دون إخبار أحد"],"c":"aware"},{"q":"رسبت في اختبار مهني مهم. أي تفسير هو الأكثر فائدة؟","o":["«طريقة استعدادي لم تكن كافية هذه المرة، ويمكنني تعديلها»","«لست ذكيًا بما يكفي لهذا المجال»","«لم يحالفني الحظ»","«كان الاختبار صعبًا، وسأحاول مرة أخرى»"],"c":"mot"},{"q":"أي المشاعر يكون عادة مزيجًا من الخوف والدهشة؟","o":["الفضول","الملل","الرهبة","الإعجاب"],"c":"und"},{"q":"موظف جديد في فريقك يبدو متوترًا في أيامه الأولى. ما الأفضل؟","o":["التوتر طبيعي ولا يستدعي شيئًا","أعرّفه بالفريق، وأعرض أن أكون مرجعًا له في أسئلته اليومية","أنتظر أن يطلب المساعدة بنفسه","أرسل له دليل العمل ليقرأه"],"c":"emp"},{"q":"خرجت من اجتماع وأنت تشعر بضيق لا تعرف سببه. ما أفضل خطوة؟","o":["أفترض أن أحد الحاضرين قصد إزعاجي","أتحدث مع زميل موثوق عن الاجتماع","أنشغل بعمل آخر حتى يزول الضيق","أتوقف لحظة لأسمّي الشعور بدقة، وأتتبع ما أثاره في الاجتماع"],"c":"aware"},{"q":"إذا تبيّن للغاضب أن الإساءة كانت غير مقصودة، فإلى أي شعور يتحول غضبه غالبًا؟","o":["يتراجع الغضب، وقد يصحبه حرج من التسرع","الخوف","الحزن","يستمر الغضب كما هو"],"c":"und"},{"q":"حققت هدفًا كبيرًا. أي تصرف يعكس دافعية ناضجة؟","o":["أنتقل مباشرة إلى هدف آخر دون توقف","أنتظر أن يحدد لي أحد هدفًا جديدًا","أرتاح فترة ثم أفكر في الخطوة القادمة","أحتفي بالإنجاز، وأراجع ما تعلمته، ثم أضع هدفًا جديدًا أعلى"],"c":"mot"},{"q":"تعمل على مشروع طويل لا تظهر نتائجه قبل سنة. كيف تحافظ على حماسك؟","o":["أذكّر نفسي بالمكافأة النهائية","أعتمد على مديري ليحفزني","أربط المشروع بقيمة تهمني، وأقسمه إلى مراحل أحتفي بإنجاز كل منها","أعمل عليه فقط حين يقترب موعد التسليم"],"c":"mot"},{"q":"زميلك الذي كان مرحًا دائمًا أصبح صامتًا منذ أسبوع. ما التصرف الأنسب؟","o":["أسأل الزملاء الآخرين عمّا به","أمازحه أمام الجميع ليعود إلى مرحه","أسأله على انفراد وبلطف إن كان كل شيء على ما يرام، وأحترم رغبته إن لم يُرد الحديث","أترك له مساحة وأبقى متاحًا"],"c":"emp"},{"q":"رُفض مشروعك بعد جهد طويل، وتشعر بالإحباط. ما الاستجابة الأكثر اتزانًا؟","o":["أسمح لنفسي بالشعور بالإحباط، ثم أطلب أسباب الرفض لأستفيد منها","أقرر ألا أبذل جهدًا إضافيًا مستقبلًا","أكتم الإحباط وأتظاهر بأن الأمر لا يهمني","أنتقل فورًا إلى مشروع آخر"],"c":"reg"},{"q":"علّق زميل بسخرية على فكرتك أمام الفريق. ما التصرف الأنسب؟","o":["أتجاهل التعليق وأكمل","أحافظ على هدوئي، وأعيد طرح الفكرة بموضوعية، ثم أحدّثه على انفراد لاحقًا","أنسحب من النقاش","أرد عليه بسخرية مماثلة"],"c":"reg"},{"q":"عميل مسنّ يكرر سؤاله للمرة الثالثة وهو مرتبك. ما الأنسب؟","o":["أكتب له المعلومة على ورقة وأنهي اللقاء","أكرر الشرح بالطريقة نفسها بهدوء","أشرح بطريقة مختلفة وأبسط، بصبر، وأتأكد من فهمه","أطلب منه أن يأتي مع أحد أبنائه"],"c":"emp"},{"q":"شخص تعرّض لظلم متكرر ولم يستطع الرد. أي الانفعالات أرجح أن يتراكم لديه؟","o":["الخجل","الحزن","الاستياء والغضب المكبوت","الملل"],"c":"und"}],"social":[{"q":"لاحظت في مجلس أن أحد الحضور صامت ويبدو مستبعدًا من الحديث. ما التصرف الأذكى؟","o":["أجلس بجانبه لاحقًا وأتحدث معه","أوجّه إليه سؤالًا عن موضوع يعرفه","أعلّق مازحًا على صمته","أتركه، فربما يحب الصمت"],"c":"cue"},{"q":"أثناء حديثك، ينظر محدّثك إلى ساعته مرارًا ويوجّه جسده نحو الباب. ماذا يعني ذلك غالبًا؟","o":["غاضب منك","يشعر بالملل من الموضوع","يفكر بعمق فيما تقول","يرغب في إنهاء الحديث أو أنه مستعجل"],"c":"cue"},{"q":"في مجلس لكبار السن، طُرح رأي تعتقد أنه خاطئ. ما الأنسب؟","o":["أسكت احترامًا","أعرض رأيي بأدب وتقدير، بصيغة السؤال أو الإضافة لا التخطئة","أنتظر وأوضح رأيي لأحدهم على انفراد","أصحح الرأي مباشرة وبحزم"],"c":"norm"},{"q":"انضممت إلى مؤسسة جديدة ثقافتها رسمية جدًا. ما الأنسب في الأسابيع الأولى؟","o":["أتصرف بطبيعتي، والناس سيتأقلمون معي","أراقب الأعراف السائدة وأتكيف معها قبل أن أقترح أي تغيير","أكون رسميًا جدًا وأتجنب أي حديث ودّي","أسأل زميلًا عن الأعراف غير المكتوبة"],"c":"norm"},{"q":"في تفاوض، يصر الطرف الآخر على شرط لا يمكنك قبوله. ما الأنسب؟","o":["أرفض وأنهي التفاوض","أقبل الشرط حفاظًا على العلاقة","أقدّم تنازلًا في جانب آخر مقابل التخلي عن الشرط","أستكشف المصلحة الكامنة خلف الشرط، وأبحث عن بديل يحققها"],"c":"conf"},{"q":"انضم إلى فريقك عضو من قسم آخر ويشعر بالغربة. ما الأنفع لتماسك الفريق؟","o":["أكلفه بمهمة تُبرز خبرته وتربطه بأعضاء الفريق","أرحب به في اجتماع الفريق","أتركه يتأقلم بمرور الوقت","أطلب من الفريق مراعاته"],"c":"grp"},{"q":"أخطأ زميلك في نطق اسم عميل أمامه. ما الأنسب؟","o":["أنبهه بعد اللقاء على انفراد","أصحح له فورًا أمام العميل","لا أنبهه أبدًا","أنطق الاسم صحيحًا في حديثي أمام العميل بشكل طبيعي دون إشارة للخطأ"],"c":"norm"},{"q":"صديق يقول «أنا بخير»، لكن صوته منخفض ويتجنب النظر إليك. ما الأنسب؟","o":["أصدّق كلامه وأنتقل لموضوع آخر","أحترم إجابته وأبقى قريبًا، وأفتح له باب الحديث لاحقًا بلطف","أضغط عليه حتى يعترف بما به","أخبره أن لغة جسده تكشف أنه ليس بخير"],"c":"cue"},{"q":"انتقدك زميل بأسلوب غير لائق، لكن مضمون نقده صحيح. ما الأنضج؟","o":["أقبل النقد وأتجاهل الأسلوب","أرفض النقد لأن أسلوبه غير لائق","أشكوه إلى المدير","أفصل الأسلوب عن المضمون: أستفيد من الملاحظة، وأبلغه بهدوء لاحقًا أن أسلوبه أزعجني"],"c":"conf"},{"q":"في فريق جديد، يسيطر شخص واحد على الحديث في كل اجتماع. بصفتك منسق الاجتماع:","o":["أترك الأمر لأن لديه أفكارًا جيدة","أقاطعه أمام الجميع","أطلب منه بلطف على انفراد أن يترك مجالًا للآخرين","أستخدم تدوير الكلمة وأطلب رأي كل عضو بالترتيب"],"c":"grp"},{"q":"أرسل لك مديرك رسالة في وقت متأخر ليلًا عن أمر غير عاجل. ما الأنسب؟","o":["أرد صباحًا في وقت العمل، إلا إذا فهمت من السياق أنه عاجل","أرد وألفت نظره إلى أن الوقت متأخر","أرد فورًا دائمًا","أتجاهل الرسالة"],"c":"norm"},{"q":"قال زميل: «فكرة ممتازة» بنبرة باردة ووجه خالٍ من التعبير. الأرجح أنه:","o":["معجب فعلًا بالفكرة","لديه تحفظ لم يصرّح به","متعب فحسب","يمزح"],"c":"cue"},{"q":"أثناء عرضك التقديمي، لاحظت أن الحضور بدأوا يفقدون الانتباه. ما الأذكى؟","o":["أتحول إلى سؤال تفاعلي أو مثال واقعي قريب منهم","أسرع لأنهي العرض","أكمل كما خططت","أرفع صوتي"],"c":"cue"},{"q":"في اجتماع، عقد المدير ذراعيه وقطّب حاجبيه عندما عرضتَ الأرقام. ما التصرف الأذكى؟","o":["أسرّع العرض لأتجاوز هذا الجزء","أعيد شرح الأرقام نفسها بتفصيل أكثر","أكمل كما خططت","أتوقف وأسأله إن كانت لديه ملاحظة على الأرقام"],"c":"cue"},{"q":"أي سلوك يبني الثقة أسرع مع فريق جديد تقوده؟","o":["الإكثار من المزاح والود","الوفاء بالوعود الصغيرة باستمرار، والاعتراف بالأخطاء","الحزم والصرامة من اليوم الأول","استعراض الخبرات والإنجازات السابقة"],"c":"infl"},{"q":"اختلف زميلان في فريقك وتأثر العمل. بصفتك قائد الفريق، ما الأنسب؟","o":["أتحدث مع كل منهما منفردًا وأطلب التعاون","أنتظر حتى يحلا الأمر بنفسيهما","أجمعهما، وأستمع لكل طرف، ونركز على المصلحة المشتركة والحلول","أحدد المخطئ وأنحاز للطرف المحق علنًا"],"c":"conf"},{"q":"طُلب رأيك أمام الفريق في خطة قدمها صديق مقرب، وفيها ثغرة كبيرة. ما الأذكى اجتماعيًا ومهنيًا؟","o":["أذكر نقاط قوتها، ثم أطرح الثغرة كسؤال بنّاء لتحسينها","أنتقدها بصراحة تامة أمام الجميع","أؤجل رأيي وأخبره على انفراد بعد الاجتماع","أجاملها حفاظًا على الصداقة"],"c":"grp"},{"q":"عند تقديم العزاء، أي السلوكيات أنسب؟","o":["تقديم نصائح عن تجاوز الحزن","الحضور، والكلام القليل الصادق، والدعاء","الحديث في شؤون العمل لتخفيف الجو","الحديث المطوّل عن تفاصيل الوفاة"],"c":"norm"},{"q":"تريد إقناع إدارتك بتبني نظام جديد. أي نهج أنجع؟","o":["أشرح المزايا التقنية بالتفصيل","أربط النظام بأولويات الإدارة، وأقدّم بيانات وتجربة صغيرة ناجحة","أذكر أن المنافسين يستخدمونه","أكرر الطلب حتى يوافقوا"],"c":"infl"},{"q":"عميل غاضب يرفع صوته في الفرع. ما الأنجع؟","o":["أحيله إلى مسؤول آخر فورًا","أطلب منه خفض صوته أولًا","أشرح له فورًا أن الخطأ ليس خطأنا","أنصت دون مقاطعة، وأعترف بانزعاجه، ثم أنتقل إلى الحل بصوت هادئ"],"c":"conf"},{"q":"تريد أن يلتزم زملاؤك بإجراء جديد يرونه مرهقًا. ما الأنجع؟","o":["أشركهم في تصميم طريقة التطبيق، وأوضح سبب الإجراء","أفرض عقوبات على المخالفين","أرسل تعميمًا رسميًا ملزمًا","أقدّم مكافأة للملتزمين"],"c":"infl"},{"q":"في الاجتماعات، يرفض زميل كل اقتراح دون أن يقدم بديلًا. ما الأذكى؟","o":["أطلب من المدير حسم الأمر","أواجهه أمام الجميع بأنه سلبي","أتجاهل اعتراضاته","أسأله: «ما الذي يجعل الاقتراح مقبولًا لك؟» لتحويل الاعتراض إلى معيار"],"c":"conf"},{"q":"في مجموعة عمل، يتأخر أحد الأعضاء دائمًا ويؤثر على الجميع. ما الأنسب؟","o":["أشكوه إلى المسؤول مباشرة","أنجز مهامه بنفسي","أتحدث معه على انفراد لأفهم السبب، ونتفق على مواعيد واضحة","أناقش المشكلة أمام المجموعة"],"c":"grp"},{"q":"تحتاج دعم زميل مشغول لا تربطك به علاقة قوية. ما الأنسب؟","o":["أذكّره يوميًا حتى يستجيب","أرسل له طلبًا مفصلًا طويلًا بالبريد","أوضح له باختصار ما أحتاجه ولماذا يهمه أيضًا، وأحترم وقته","أطلب من مديره أن يكلفه"],"c":"infl"},{"q":"أي علامة تدل على أن الفريق يتمتع بالأمان النفسي؟","o":["لا توجد خلافات","يُنجز العمل في موعده","يعترف الأعضاء بأخطائهم ويطرحون الأسئلة دون خوف","يلتزم الجميع بتعليمات المدير"],"c":"grp"},{"q":"كيف تبدأ حديثًا مع شخص تقابله لأول مرة في مناسبة مهنية؟","o":["بالحديث عن إنجازاتي","بسؤال مفتوح عن عمله أو اهتمامه، مع الإصغاء لما يقول","بتعليق عام عن المناسبة","أنتظر أن يبدأ هو"],"c":"infl"},{"q":"فريق يوافق دائمًا على رأي المدير دون نقاش. ما الخطر الأكبر؟","o":["إرهاق المدير","كثرة الخلافات","بطء اتخاذ القرارات","قرارات ضعيفة لغياب الآراء المخالفة (التفكير الجمعي)"],"c":"grp"},{"q":"دعاك مديرك الأعلى إلى غداء عمل مع عميل كبير. ما الأنسب؟","o":["أتحدث عن أموري الشخصية لكسر الجمود","أتحدث كثيرًا لأُبرز نفسي","أبقى صامتًا طوال الوقت","أترك المدير يقود الحديث، وأشارك بإيجاز عند الحاجة أو عندما يُطلب مني"],"c":"norm"},{"q":"عندما تقدم ملاحظة تصحيحية لموظف، أي صيغة أكثر فاعلية؟","o":["«أداؤك جيد، لكن...»","أرسلها مكتوبة حتى لا يُحرج","أصف السلوك المحدد وأثره، ثم نتفق على ما يمكن تحسينه","«أنت دائمًا متأخر في التسليم»"],"c":"infl"},{"q":"صديقان مقربان لك متخاصمان، وكل منهما يريدك في صفه. ما الأنسب؟","o":["أنقل لكل منهما ما يقوله الآخر ليفهما بعضهما","أبتعد عن الاثنين حتى ينتهي الخلاف","أحافظ على حيادي، وأرفض نقل الكلام، وأشجعهما على الحديث مباشرة","أنحاز لمن أراه محقًا"],"c":"conf"}],"bigfive":{"items":[{"t":"E","k":1,"q":"أشعر بالحيوية عندما أكون بين الناس."},{"t":"A","k":1,"q":"أهتم بمشاعر الآخرين وأحوالهم."},{"t":"C","k":1,"q":"أنجز مهامي قبل موعدها المحدد."},{"t":"N","k":1,"q":"أقلق كثيرًا بشأن أمور قد لا تحدث."},{"t":"O","k":1,"q":"أستمتع بالتفكير في الأفكار المجردة والنظريات."},{"t":"E","k":-1,"q":"أفضّل قضاء وقتي بمفردي على حضور التجمعات الكبيرة."},{"t":"A","k":-1,"q":"أنتقد الآخرين بسهولة."},{"t":"C","k":-1,"q":"أترك أغراضي في غير أماكنها."},{"t":"N","k":-1,"q":"أبقى هادئًا في المواقف الصعبة."},{"t":"O","k":-1,"q":"أفضّل الروتين المألوف على التجارب الجديدة."},{"t":"E","k":1,"q":"أبادر بالتعارف في المناسبات."},{"t":"A","k":1,"q":"أثق بنوايا الناس عمومًا."},{"t":"C","k":1,"q":"أهتم بالتفاصيل وأراجع عملي بدقة."},{"t":"N","k":1,"q":"يتقلب مزاجي بسرعة."},{"t":"O","k":1,"q":"أحب تجربة أطعمة وأماكن وأساليب جديدة."},{"t":"E","k":-1,"q":"أتحدث قليلًا عندما أكون في مجموعة."},{"t":"A","k":-1,"q":"لا تشغلني مشكلات الآخرين كثيرًا."},{"t":"C","k":-1,"q":"أؤجل الأعمال المهمة كثيرًا."},{"t":"N","k":-1,"q":"نادرًا ما أشعر بالحزن أو الإحباط."},{"t":"O","k":-1,"q":"لا أهتم كثيرًا بالفن والأدب."},{"t":"E","k":1,"q":"لا أمانع أن أكون محور الاهتمام."},{"t":"A","k":1,"q":"أسعى إلى التوافق وتجنب الخلافات غير الضرورية."},{"t":"C","k":1,"q":"أضع خطة واضحة قبل البدء في أي عمل."},{"t":"N","k":1,"q":"أتوتر بسهولة تحت الضغط."},{"t":"O","k":1,"q":"لدي خيال واسع وأحب التأمل."},{"t":"E","k":-1,"q":"أحتاج وقتًا لأستعيد طاقتي بعد اللقاءات الاجتماعية الطويلة."},{"t":"A","k":-1,"q":"أقدّم مصلحتي أولًا حتى لو تضرر غيري."},{"t":"C","k":-1,"q":"أنسى أحيانًا الوفاء بالتزاماتي."},{"t":"N","k":-1,"q":"أتعافى بسرعة بعد المواقف المزعجة."},{"t":"O","k":-1,"q":"أجد النقاشات الفلسفية مضيعة للوقت."}],"traits":{"O":{"name":"الانفتاح على الخبرة","short":"الانفتاح","what":"الفضول الفكري، والخيال، والإقبال على الجديد والتنوع.","hi":"عقل فضولي يحب الأفكار الجديدة والتجريب، ويرى الروابط بين المجالات. تزدهر في البيئات التي تكافئ الإبداع والتطوير، وقد تملّ من الروتين الطويل.","mid":"توازن بين تقدير الجديد والاعتماد على المجرَّب؛ تنفتح على الأفكار حين ترى فائدتها العملية.","lo":"تميل إلى الواقعية والعملية وتفضّل الأساليب المجرّبة. هذا مصدر ثبات وموثوقية، وقد يحتاج إلى مرونة أكبر عند التغيير.","tipHi":"حوّل أفكارك إلى خطط صغيرة قابلة للتنفيذ حتى لا تتشتت بين البدايات.","tipLo":"جرّب تغييرًا صغيرًا واحدًا كل شهر في طريقة عملك، وقيّم أثره بهدوء."},"C":{"name":"يقظة الضمير","short":"الانضباط","what":"التنظيم، والمثابرة، والالتزام بالمواعيد والمعايير.","hi":"منظم وموثوق، تفي بوعودك وتخطط قبل أن تعمل. هذه السمة من أقوى المنبئات بالأداء المهني، مع الحذر من الكمالية والجمود.","mid":"منضبط في الأمور المهمة، ومرن في التفاصيل الأقل أهمية.","lo":"عفوي ومرن وسريع التكيف، لكنك قد تعاني من التأجيل أو تشتت المهام.","tipHi":"ميّز بين ما يستحق الإتقان الكامل وما يكفيه (جيد بما يكفي).","tipLo":"اعتمد قائمة مهام يومية قصيرة (٣ أولويات) ومواعيد تسليم مكتوبة."},"E":{"name":"الانبساط","short":"الانبساط","what":"استمداد الطاقة من التفاعل الاجتماعي، والحماس، والمبادرة.","hi":"اجتماعي نشيط، تستمد طاقتك من الناس، وتبادر بالحديث والقيادة. تحتاج أحيانًا إلى الإصغاء أكثر وإفساح المجال للآخرين.","mid":"متوازن بين الاجتماعية والحاجة إلى الهدوء؛ تتكيف مع الموقف.","lo":"هادئ متأمل، تستعيد طاقتك في العزلة، وتفضّل العمق على الاتساع في العلاقات. قوتك في التركيز والإصغاء.","tipHi":"خصص في كل اجتماع لحظة لسؤال الأكثر صمتًا عن رأيه.","tipLo":"جهّز نقطتين قبل كل اجتماع لتضمن حضور صوتك دون استنزاف."},"A":{"name":"الوداعة (المقبولية)","short":"الوداعة","what":"التعاطف، والتعاون، والثقة بالآخرين، والميل إلى الانسجام.","hi":"متعاون متعاطف، يثق به الناس ويرتاحون إليه. احذر من صعوبة الرفض أو تغليب إرضاء الآخرين على مصلحة العمل.","mid":"تجمع بين التعاون والحزم؛ تراعي الآخرين دون أن تتنازل عن الأساسيات.","lo":"صريح وتنافسي ومستقل الرأي، مناسب للتفاوض واتخاذ القرارات الصعبة، وقد تحتاج إلى مزيد من اللين في التواصل.","tipHi":"تدرّب على الرفض اللبق: «أقدّر طلبك، ولا أستطيع هذه المرة».","tipLo":"ابدأ ملاحظاتك النقدية بما تقدّره فعلًا في عمل الآخر."},"N":{"name":"الاستقرار الانفعالي","short":"الاستقرار","what":"الهدوء تحت الضغط وسرعة التعافي من المواقف المزعجة (عكس العُصابية).","hi":"هادئ متزن تحت الضغط، تتعافى سريعًا من الإحباطات، ويستمد منك الآخرون الطمأنينة.","mid":"متزن غالبًا، وقد تتأثر في فترات الضغط الشديد.","lo":"حساس للضغوط، تشعر بالقلق أو تقلب المزاج بسهولة. هذه الحساسية قد تجعلك منتبهًا للمخاطر، لكنها تستحق إدارة واعية.","tipHi":"استثمر هدوءك في دعم الفريق وقت الأزمات، مع الانتباه لمشاعرك وعدم تجاهلها.","tipLo":"جرّب تقنية (سمّ الشعور ثم تنفس ببطء) وخصص وقتًا يوميًا للنشاط البدني ."},"INTP":{"n":"المفكر المحلل","s":"فضولي، تحليلي، يبحث عن الاتساق المنطقي في كل شيء. يحب النظريات والنماذج والأسئلة الصعبة.","st":["التحليل العميق","الأصالة الفكرية","الموضوعية"],"bl":["إهمال التنفيذ والتفاصيل العملية","الانعزال"],"wk":"البحث، والبرمجة، والتحليل، والتصميم المفاهيمي.","dev":"اختر فكرة واحدة وأكملها حتى التطبيق، وانتبه لمشاعر من تناقشهم."},"ESTP":{"n":"المبادر الواقعي","s":"نشيط، عملي، سريع البديهة. يحب الفعل والمخاطرة المحسوبة والنتائج الفورية.","st":["سرعة التصرف","المهارة في التفاوض","الواقعية"],"bl":["الاندفاع","الملل من التخطيط الطويل"],"wk":"المبيعات، وريادة الأعمال، والعمليات الميدانية، وإدارة الأزمات.","dev":"توقف لحظة قبل القرارات الكبيرة لتقيّم عواقبها البعيدة."},"ESFP":{"n":"المؤدي المرح","s":"حيوي، ودود، يحب الناس واللحظة الحاضرة. يضفي البهجة ويجيد التعامل العملي مع الآخرين.","st":["الحيوية والتفاؤل","المهارة الاجتماعية","العملية"],"bl":["تجنب المشكلات المزعجة","ضعف التخطيط المالي والزمني"],"wk":"خدمة العملاء، والفعاليات، والتسويق، والتدريب التفاعلي.","dev":"خصص وقتًا أسبوعيًا للتخطيط، وواجه المشكلات مبكرًا قبل أن تكبر."},"ENFP":{"n":"المتحمّس الملهِم","s":"متحمس، مبدع، يرى الإمكانات في الناس والأفكار. يلهم من حوله ويكره القيود.","st":["الإلهام والتحفيز","توليد الأفكار","التواصل الدافئ"],"bl":["التشتت بين المشاريع","إهمال التفاصيل"],"wk":"التدريب، والتسويق، والإعلام، والابتكار، وتنمية الموارد البشرية.","dev":"اعتمد نظامًا بسيطًا للمتابعة، واختر ثلاث أولويات فقط كل شهر."},"ENTP":{"n":"المبتكر المجادِل","s":"ذكي، سريع، يحب التحدي الفكري ويفكك الافتراضات. يرى حلولًا لا يراها غيره.","st":["الابتكار","المرونة الفكرية","مهارة الحجاج"],"bl":["الجدل للجدل","ضعف المتابعة"],"wk":"الاستشارات، وريادة الأعمال، وتطوير المنتجات، والاستراتيجية.","dev":"ميّز بين النقاش المثمر والجدل، وسلّم المتابعة لمن يتقنها."},"ESTJ":{"n":"المدير الحازم","s":"منظم، حاسم، يحب الإنجاز وفق معايير واضحة. يدير الناس والموارد بكفاءة.","st":["التنظيم والإدارة","الحسم","الالتزام بالمعايير"],"bl":["التصلب في الرأي","إغفال مشاعر الفريق"],"wk":"الإدارة التشغيلية، والامتثال، والمش S"]},{"q":"أكثر ما يحفزني:","o":["الاستقرار والأمان","الجودة والدقة","التحدي وتحقيق النتائج","التقدير والاعتراف"],"s":["S","C","D","I"]},{"q":"أكثر ما أتجنبه في العمل:","o":["التغيير المفاجئ","الرفض أو التجاهل","فقدان السيطرة على الأمور","الوقوع في الخطأ"],"s":["S","I","D","C"]},{"q":"عند اتخاذ قرار مهم:","o":["أستشير الناس وأتبع حماسي","أجمع أكبر قدر من المعلومات","أقرر بسرعة وأتحمل المسؤولية","أتمهل وأراعي أثره على الآخرين"],"s":["I","C","D","S"]},{"q":"أسلوبي في التواصل:","o":["حيوي ومعبّر","مباشر ومختصر","هادئ وودود","دقيق ومدعوم بالتفاصيل"],"s":["I","D","S","C"]},{"q":"عندما أتلقى تعليمات جديدة:","o":["أتحقق من تفاصيلها ومنطقها","أحتاج وقتًا لأعتاد عليها","أبحث عن أسرع طريق لتحقيق النتيجة","أشارك بها الآخرين ونتناقش فيها"],"s":["C","S","D","I"]},{"q":"بيئة العمل المثالية لي:","o":["فيها معايير واضحة ونظام","فيها صلاحيات وتحديات","فيها تعاون واستقرار","فيها تفاعل وتنوع"],"s":["C","D","S","I"]},{"q":"عند مواجهة مشكلة مفاجئة:","o":["أتصرف فورًا","أحافظ على هدوء الفريق وأتابع الحل خطوة خطوة","أحلل أسبابها قبل التصرف","أجمع الناس لنحلها معًا"],"s":["D","S","C","I"]},{"q":"أقوى ما أسهم به في الفريق:","o":["الإلهام والتحفيز","التحليل والتدقيق","القيادة والحسم","الدعم والوفاء"],"s":["I","C","D","S"]},{"q":"في وقت الفراغ أفضّل:","o":["نشاطًا فيه منافسة","وقتًا هادئًا مع العائلة","قراءة أو هواية تتطلب إتقانًا","لقاءً مع الأصدقاء"],"s":["D","S","C","I"]},{"q":"عندما أقود فريقًا:","o":["أهتم بانسجام الفريق وراحة أعضائه","أضع إجراءات ومعايير واضحة","أضع أهدافًا طموحة وأتابع النتائج","أحفّز الفريق وأحتفي بالنجاحات"],"s":["S","C","D","I"]},{"q":"نقطة الضعف التي قد يلاحظها الآخرون علي:","o":["الإفراط في التدقيق","نفاد الصبر","صعوبة قول (لا)","قلة المتابعة للتفاصيل"],"s":["C","D","S","I"]},{"q":"عندما يعارضني أحد:","o":["أطلب منه الدليل وأقدّم دليلي","أدافع عن رأيي بقوة","أتنازل حفاظًا على العلاقة","أحاول إقناعه بحماس"],"s":["C","D","S","I"]},{"q":"في كتابة التقارير:","o":["أجعلها جذابة وسهلة القراءة","أركز على الخلاصة والتوصيات","أتأكد أنها تلبي حاجة من سيقرؤها","أحرص على دقة const AR="٠١٢٣٤٥٦٧٨٩";
const ar=x=>String(x).replace(/\d/g,d=>AR[d]).replace(/\./g,"٫");

const ENDPOINT=(window.MKH_ENDPOINT||"").trim();
const LET=["أ","ب","ج","د","هـ","و"];

let KEY=null;
function getKey(){if(KEY)return KEY;const b=atob(KBLOB),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i)^KSALT.charCodeAt(i%KSALT.length);KEY=JSON.parse(new TextDecoder().decode(u));return KEY;}
const BANDS=[["مرتفع جدًا (عبقري)","--b6",130],["ذكاء مرتفع","--b5",120],["جيد (أعلى من المتوسط)","--b4",110],["متوسط","--b3",90],["أقل من المتوسط","--b2",80],["ضعيف ويحتاج إلى عناية","--b1",-1]];
const bandColor=l=>{const b=BANDS.find(x=>x[0]===l);return b?b[1]:"--muted";};

const fmtDay=s=>{const d=new Date(s);if(isNaN(d))return "—";try{return d.toLocaleDateString("ar-OM",{day:"numeric",month:"short",timeZone:"Asia/Muscat"});}catch(e){return ar(d.toISOString().slice(0,10));}};

/* ---------- الحالة ---------- */
const st={code:"",rows:[],loaded:null,err:"",loading:false,tab:"overview",person:null,open:{},f:{q:"",group:"",test:"",status:""},sort:{k:"last",d:-1},del:null};
try{st.code=sessionStorage.getItem("mkh-trainer")||"";}catch(e){}

function parseRows(rows){
  return rows.filter(r=>r&&r.attempt_id).map(r=>{
    const o={...r};
    for(const k of ["details_json","answers_json"]){try{o[k.replace("_json","")]=o[k]?JSON.parse(o[k]):null;}catch(e){o[k.replace("_json","")]=null;}}
    o.answered=+o.answered||0; o.score=o.score===""?null:+o.score; o.percentile=o.percentile===""?null:+o.percentile;
    o.duration_min=o.duration_min===""?null:+o.duration_min;
    o.last=o.completed_at||o.updated_at||o.started_at;
    o.grp=(o.group||o.org||"").toString().trim();
    o.contact=String(o.contact||"").replace(/^'/,"");
    return o;
  });
}
async function load(){
  if(!ENDPOINT){st.err="setup";render();return;}
  st.loading=true;render();
  try{
    const r=await fetch(ENDPOINT+(ENDPOINT.includes("?")?"&":"?")+"code="+encodeURIComponent(st.code));
    const j=await r.json();
    if(!j.ok){st.err=j.error==="unauthorized"?"code":"server";st.rows=[];if(st.err==="code"){st.code="";try{sessionStorage.removeItem("mkh-trainer");}catch(e){}}}
    else{st.rows=parseRows(j.rows||[]);st.err="";st.loaded=new Date();try{sessionStorage.setItem("mkh-trainer",st.code);}catch(e){}}
  }catch(e){st.err="net";}
  st.loading=false;render();
}
async function post(body){
  return fetch(ENDPOINT,{method:"POST",body:JSON.stringify({...body,code:st.code}),headers:{"Content-Type":"text/plain;charset=utf-8"}}).then(r=>r.json()).catch(()=>({ok:false}));
}

/* ---------- التجميع ---------- */
function filtered(){
  const f=st.f,q=f.q.trim().toLowerCase();
  return st.rows.filter(r=>(!f.group||r.grp===f.group)&&(!f.test||r.test_id===f.test)&&(!f.status||(f.status==="open"?r.status!=="completed":r.status===f.status))
    &&(!q||[r.name,r.contact,r.org,r.group].join(" ").toLowerCase().includes(q)));
}
function people(rows){
  const m=new Map();
  for(const r of rows){
    const k=r.participant_id||r.name;
    if(!m.has(k))m.set(k,{pid:k,name:r.name,contact:r.contact,org:r.org,group:r.group,age:r.age,gender:r.gender,device:r.device,att:[],last:r.last});
    const p=m.get(k);p.att.push(r);
    if(new Date(r.last)>new Date(p.last)){p.last=r.last;p.name=r.name;p.contact=r.contact||p.contact;p.org=r.org||p.org;}
  }
  for(const p of m.values()){
    p.done=p.att.filter(a=>a.status==="completed");
    const iq=p.done.filter(a=>T(a.test_id)&&T(a.test_id).kind==="iq"&&a.score!=null);
    const cog=iq.filter(a=>["logic","numeric","verbal","spatial"].includes(a.test_id));
    p.avgIQ=iq.length?Math.round(iq.reduce((s,a)=>s+a.score,0)/iq.length):null;
    p.cog=cog.length?Math.round(cog.reduce((s,a)=>s+a.score,0)/cog.length):null;
  }
  return [...m.values()];
}

  const rows=filtered();
  if(!st.rows.length) return header()+tabs()+`<div class="empty" style="padding:40px">لا توجد بيانات بعد. ستظهر هنا محاولات المشاركين فور بدئهم أي مقياس.</div>`;
  return header()+tabs()+filtersBar()+(st.tab==="overview"?overview(rows):st.tab==="people"?peopleView(rows):logView(rows));
}
function render(){
  const app=$("#app"), ae=document.activeElement, focusId=ae&&ae.id, pos=ae&&ae.selectionStart;
  app.innerHTML = (!st.code||st.err) ? loginView() : st.person ? personView() : mainView();
  if(focusId){const el=document.getElementById(focusId);if(el){el.focus();if(pos!=null&&el.setSelectionRange)try{el.setSelectionRange(pos,pos);}catch(e){}}}
}
function csv(){
  const cols=[["name","الاسم"],["contact","الهاتف/البريد"],["org","الجهة"],["group","الدورة"],["age","الفئة العمرية"],["gender","الجنس"],["test_name","المقياس"],["status","الحالة"],["answered","عدد الإجابات"],["score","الدرجة"],["band","التصنيف"],["percentile","أعلى من %"],["summary","الخلاصة"],["duration_min","المدة (دقيقة)"],["started_at","بدأ"],["completed_at","اكتمل"],["device","الجهاز"]];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[cols.map(c=>q(c[1])).join(",")].concat(filtered().map(r=>cols.map(([k])=>q(k==="status"?(STATUS[r[k]]||[r[k]])[0]:r[k])).join(",")));
  const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="نتائج-المشاركين.csv";document.body.appendChild(a);a.click();a.remove();
}

/* ---------- التفاعل ---------- */
document.addEventListener("submit",e=>{if(e.target.id==="loginf"){e.preventDefault();st.code=$("#tcode").value.trim();st.err="";if(st.code)load();}});
document.addEventListener("input",e=>{if(e.target.id==="fq"){st.f.q=e.target.value;render();}});
document.addEventListener("change",e=>{const m={fg:"group",ft:"test",fs:"status"}[e.target.id];if(m){st.f[m]=e.target.value;render();}});
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act],[data-tab],[data-person],[data-test],[data-sort],[data-ans],[data-delatt],[data-delp]"); if(!el) return;
  e.preventDefault();
  const d=el.dataset;
  if(d.act==="refresh") return load();
  if(d.act==="logout"){st.code="";st.rows=[];st.person=null;try{sessionStorage.removeItem("mkh-trainer");}catch(x){}return render();}
  if(d.act==="csv") return csv();
  if(d.act==="clear"){st.f={q:"",group:"",test:"",status:""};return render();}
  if(d.act==="back"){st.person=null;st.del=null;return render();}
  if(d.tab){st.tab=d.tab;st.person=null;return render();}
  if(d.test){st.f.test=d.test;st.tab="log";return render();}
  if(d.sort){st.sort=st.sort.k===d.sort?{k:d.sort,d:-st.sort.d}:{k:d.sort,d:1};return render();}
  if(d.person!==undefined){st.person=d.person;st.del=null;window.scrollTo({top:0});return render();}
  if(d.ans){st.open[d.ans]=!st.open[d.ans];return render();}
  if(d.delatt){if(st.del!==d.delatt){st.del=d.delatt;return render();}
    const r=await post({action:"delete",attempt_ids:[d.delatt]}); if(r.ok){st.rows=st.rows.filter(x=>x.attempt_id!==d.delatt);} st.del=null;return render();}
  if(d.delp){if(st.del!=="p:"+d.delp){st.del="p:"+d.delp;return render();}
    const r=await post({action:"delete",participant_id:d.delp}); if(r.ok){st.rows=st.rows.filter(x=>(x.participant_id||x.name)!==d.delp);st.person=null;} st.del=null;return render();}
});
if(st.code) load(); else { if(!ENDPOINT) st.err="setup"; render(); }
</script>
